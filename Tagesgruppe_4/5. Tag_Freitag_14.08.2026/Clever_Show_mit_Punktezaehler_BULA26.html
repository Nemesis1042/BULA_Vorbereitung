document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box- ral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"76cf088b-831b-49c3-bd7c-5cd09ab0942b\"><\u002Fscript>\n<title>Quiz-Vorlage — 16:9<\u002Ftitle>\n\n\n<script>\n/* Der Bundler legt die inlinierte Logo-Datei unter window.__resources.cleverLogo ab;\n   die <image-slot>-Elemente bekommen ihre src daher zur Laufzeit gesetzt. */\n(function () {\n  function apply() {\n    var u = window.__resources && window.__resources.cleverLogo;\n    if (!u) return;\n    document.querySelectorAll('image-slot[src]').forEach(function (el) {\n      if (el.getAttribute('src').indexOf('uploads/') === 0) el.setAttribute('src', u);\n    });\n  }\n  var t = setInterval(apply, 300);\n  setTimeout(function () { clearInterval(t); }, 25000);\n})();\n<\u002Fscript>\n<style>\n/* 1920 x 1080 px = 33,87 x 19,05 cm. 1 cm = 56,7 px, Sicherheitsabstand 2 cm = 113 px. */\ndeck-stage {\n  --safe: 113px;\n  --type-question: 64px;\n  --type-answer: 42px;\n  --type-label: 26px;\n  --card-h: 113px;\n  --card-gap: 24px;\n  --radius-card: 20px;\n  --font-deck: \"Trebuchet MS\", \"Segoe UI\", Verdana, Arial, sans-serif;\n  --orange-top: #FEBF00;\n  --orange-bottom: #FF8800;\n  --box: #003366;\n  --a: #FF0000;\n  --b: #FFFF00;\n  --c: #00CC00;\n}\ndeck-stage[data-red=\"soft\"] { --a: #FF5A47; }\n.slide {\n  display: flex; flex-direction: column;\n  background: linear-gradient(180deg, #FFD84A 0%, var(--orange-top) 26%, var(--orange-bottom) 84%, #EF7800 100%);\n  color: #000000; font-family: var(--font-deck); text-wrap: pretty;\n  padding: var(--safe);\n  print-color-adjust: exact; -webkit-print-color-adjust: exact;\n}\ndeck-stage[data-safe=\"on\"] .slide::after {\n  content: \"\"; position: absolute; inset: var(--safe);\n  outline: 2px dashed rgba(0, 0, 0, 0.35); pointer-events: none;\n}\n\n/* — Titelfolie: das Bild läuft randlos in den Grund, weil der Verlauf dieselben\n     Orangetöne über dieselbe Höhe führt — 768 x 576 auf 1440 x 1080 skaliert. — */\n/* — Titelfolie: das Logo liegt mittig auf dem orangen Grund (520 x 208, auf 1200 x 480 skaliert). — */\n.title-slide { padding: 0; }\n.hero-image { position: absolute; left: 0; top: 156px; width: 1920px; height: 768px; }\n.hero-image image-slot { width: 100%; height: 100%; }\n\n/* — Frage- und Experimentfolie — */\n.logo-slot { flex: none; width: 283px; height: var(--card-h); }\n.logo-slot image-slot { width: 100%; height: 100%; }\n.question {\n  font-family: var(--font-deck); font-weight: 700; color: #000000;\n  font-size: var(--type-question); line-height: 1.22; margin: 56px 0 0;\n  max-width: 1560px; min-height: 234px; /* drei Zeilen reserviert — die Karten sitzen auf jeder Folie gleich */\n  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);\n}\ndeck-stage[data-shadow=\"off\"] .question { text-shadow: none; }\n.cards { display: flex; flex-direction: column; gap: var(--card-gap); margin-top: 64px; }\n.card-a {\n  display: flex; align-items: center; gap: 32px;\n  height: var(--card-h); padding: 0 40px; box-sizing: border-box;\n  background-color: var(--box);\n  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 58%);\n  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);\n  border-radius: var(--radius-card);\n  font-size: var(--type-answer); line-height: 1.25;\n}\n.dot {\n  flex: none; width: 76px; height: 76px; border-radius: 999px;\n  display: grid; place-items: center;\n  font-size: var(--type-answer); font-weight: 700; color: var(--box);\n}\n.dot-a { background: var(--a); }\n.dot-b { background: var(--b); }\n.dot-c { background: var(--c); }\n.answer { flex: 1; }\n.answer-a { color: var(--a); }\n.answer-b { color: var(--b); }\n.answer-c { color: var(--c); }\n.answer-plain { color: #FFFFFF; }\n.card-wide, .card-why { height: auto; min-height: var(--card-h); padding-top: 28px; padding-bottom: 28px; }\n.card-why { align-items: flex-start; line-height: 1.3; }\n.solution-head { min-height: 0; }\n.setup-head { min-height: 0; }\n\n/* — Fußbalken auf allen Folien außer der Titelfolie — */\n.slide:not(.title-slide)::before {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 56px;\n  background: var(--box);\n}\n\n/* — Aufbau-Folie: Nummer im Kreis neben dem Versuchsnamen — */\n.setup-row { display: flex; align-items: center; gap: 44px; margin: 56px 0 0; }\n.setup-row .question { margin: 0; }\n.num-circle {\n  flex: none; width: 140px; height: 140px; border-radius: 999px;\n  display: grid; place-items: center;\n  background: var(--box); color: #FFFFFF;\n  font-size: 80px; font-weight: 700; line-height: 1;\n  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);\n}\n\n/* — Live-Folie: große Ansage statt Karte — */\n.live-call { flex: 1; display: grid; place-items: center; padding-bottom: 56px; }\n.live-text {\n  font-size: 120px; font-weight: 700; color: #000000; text-align: center;\n  text-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);\n}\ndeck-stage[data-shadow=\"off\"] .live-text { text-shadow: none; }\n\n/* — Animationen: laufen nur auf der aktiven Folie und respektieren die\n     Systemeinstellung „Bewegung reduzieren“. Über die Tweaks abschaltbar. — */\n@media (prefers-reduced-motion: no-preference) {\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .logo-slot { animation: quizFade 0.4s ease-out both; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .num-circle,\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .live-text { animation: quizPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: 0.14s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .question { animation: quizRise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: 0.08s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .card-a { animation: quizRise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(1) { animation-delay: 0.20s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(2) { animation-delay: 0.32s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(3) { animation-delay: 0.44s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .title-slide image-slot { animation: quizPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }\n}\n@keyframes quizRise { from { opacity: 0; transform: translateY(22px); } }\n@keyframes quizFade { from { opacity: 0; } }\n@keyframes quizPop { from { opacity: 0; transform: scale(0.94); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"53a9ef6e-4301-4eff-8859-521ec3dd4151#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-shadow=\"{{ shadowMode }}\" data-red=\"{{ redMode }}\" data-safe=\"{{ safeMode }}\" data-anim=\"{{ animMode }}\" data-uneditable=\"\">\n\n  <section class=\"slide title-slide\" data-label=\"Titelfolie\" data-screen-label=\"01\" data-speaker-notes=\"Titelfolie mit clever!-Logo.\" data-om-slide-id=\"61b6c6d1\">\n    <div class=\"hero-image\">\n      \n    <\u002Fdiv>\n  <image-slot id=\"quiz-logo-titel\" shape=\"rect\" fit=\"contain\" src=\"4b7ad008-5631-440c-aa4a-943f7c6dc29c\" placeholder=\"Logo\" style=\"width: 2029px; height: 1133px\"><\u002Fimage-slot><\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Aufbau\" data-screen-label=\"02\" data-speaker-notes=\"Durchführung: Styroporstreifen in das Aceton drücken — sie lösen sich auf.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">1<\u002Fspan><h2 class=\"question setup-head\">Aceton und Styropor<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Glas mit Aceton · Styroporstreifen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Fragefolie · Beispiel\" data-screen-label=\"03\" data-speaker-notes=\"Beispielfolie. Frage maximal drei Zeilen, Antworttexte einzeilig halten.\" data-om-slide-id=\"d7ec491c\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-frage-1b\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn ein langer Streifen Styropor in Aceton getaucht wird?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Das Styropor dehnt sich aus und geht auf<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Es passiert nichts<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Styropor wird zu einer schleimartigen Masse<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Live\" data-screen-label=\"04\" data-speaker-notes=\"Versuch vorführen, Abstimmung steht.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Aceton und Styropor<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Auflösung\" data-screen-label=\"05\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Styropor wird zu einer schleimartigen Masse<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Styropor ist ein durch Treibmittel aufgeschäumter Kunststoff. Das Aceton löst die Bindungen zwischen den Kunststoffmolekülen auf und somit zersetzt sich das Styropor.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Aufbau\" data-screen-label=\"06\" data-speaker-notes=\"Durchführung: Zeigen: Seifenblock alleine schwimmt nicht. Einen Seifenblock in Essig legen (vorbereiten), einen Block Seife mit Salz bestreuen und einen Seife 20-30 Sekunden in die Mikrowelle stellen, anschließend sollte sie schwimmfähig sein.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">2<\u002Fspan><h2 class=\"question setup-head\">Seife<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Mikrowelle · ½ Seifenblöcke<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 2 · Seife\" data-screen-label=\"07\" data-speaker-notes=\"Versuch 2 — Seife. Richtig: B (In der Mikrowelle erhitzen).\" data-om-slide-id=\"d35cbac3\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie kann man ein Stück Seife zum Schwimmen bringen?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Seife in Essig einlegen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">In der Mikrowelle erhitzen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Stück Seife mit Salz bestreuen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Live\" data-screen-label=\"08\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Seife<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Auflösung\" data-screen-label=\"09\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">In der Mikrowelle erhitzen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das in der Seife enthaltene Wasser verdampft und die in der Seife enthaltene Luft dehnt sich aus. Beides zusammen bildet ein Luftpolster, das die Seife schwimmen lässt.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Aufbau\" data-screen-label=\"10\" data-speaker-notes=\"Durchführung: Die Trockenhefe in etwa 500ml lauwarmem Wasser in Becherglas auflösen, im Anschluss in Vase geben, die bereits in der Sicherheitskiste steht. In einem weiteren Becherglas die Lebensmittelfarbe, Spüli und Wasserstoffperoxid vermischen und im Anschluss zügig in die Vase geben.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">3<\u002Fspan><h2 class=\"question setup-head\">Elefantenzahnpasta<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">2 Päckchen Trockenhefe · 1 Päckchen Lebensmittelfarbe · 125 ml Wasserstoffperoxid · Spüli<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 3 · Elefantenzahnpasta\" data-screen-label=\"11\" data-speaker-notes=\"Versuch 3 — Elefantenzahnpasta. Richtig: B (Ein riesiger Schaumberg quillt aus der Vase).\" data-om-slide-id=\"05a22654\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn Hefe zu Wasserstoffperoxid mit Spüli kommt?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Mischung wird langsam fest<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Ein riesiger Schaumberg quillt aus der Vase<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Die Flüssigkeit färbt sich, sonst passiert nichts<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Live\" data-screen-label=\"12\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Elefantenzahnpasta<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Auflösung\" data-screen-label=\"13\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Ein riesiger Schaumberg quillt aus der Vase<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">In der Hefe steckt das Enzym Katalase. Es spaltet das Wasserstoffperoxid blitzschnell in Wasser und Sauerstoff auf. Das Spüli fängt den Sauerstoff als Schaum ein — deshalb quillt die Zahnpasta aus der Vase.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Aufbau\" data-screen-label=\"14\" data-speaker-notes=\"Durchführung: 2-3 Cola-Flaschen ca. 1/3 mit Wasser auffüllen. Dann Feuerzeuggas aus der Flasche in eine weitere Cola-Flasche geben. Im Anschluss das flüssige Gas in die Wasserflasche geben und rasch umdrehen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">4<\u002Fspan><h2 class=\"question setup-head\">Feuerzeuggas und Wasser<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">4 kleine Cola-Flaschen · 2 Flaschen Feuerzeuggas inkl. Zange · Wasser<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 4 · Feuerzeuggas und Wasser\" data-screen-label=\"15\" data-speaker-notes=\"Versuch 4 — Feuerzeuggas und Wasser. Richtig: A (Die Flasche fliegt weg wie eine Rakete).\" data-om-slide-id=\"f82061dc\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn man Feuerzeuggas in eine Flasche füllt, die zu ca. 1/3 mit Wasser gefüllt ist und die Flasche dann umdreht?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Flasche fliegt weg wie eine Rakete<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Das Gas verdampft, bevor etwas passieren kann<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Gas mischt sich mit dem Wasser und wird zu starkem Sprudel<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Live\" data-screen-label=\"16\" data-speaker-notes=\"Versuch vorführen. Sicherheitsabstand!\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Feuerzeuggas und Wasser<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Auflösung\" data-screen-label=\"17\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist A<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Flasche fliegt weg wie eine Rakete<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das Feuerzeuggas, welches aus reinem Butan besteht, ist bei Raumtemperatur gasförmig. Erst wenn es kälter als -1 Grad Celsius kalt ist, ist das Butan flüssig. Trifft das kalte, flüssige Gas beim umdrehen auf das wärmere Wasser und das Kohlendioxid im Wasser, verdampft das Butan explosionsartig und treibt die Rakete in die Höhe.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Aufbau\" data-screen-label=\"18\" data-speaker-notes=\"Durchführung: CD im Holzständer in die Mikrowelle stellen und abwarten, bis sie gebrannt ist.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">5<\u002Fspan><h2 class=\"question setup-head\">CD in Mikrowelle<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Mikrowelle · CD-Rohlinge · Holzklotz/Ständer<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 5 · CD in Mikrowelle\" data-screen-label=\"19\" data-speaker-notes=\"Versuch 5 — CD in Mikrowelle. Richtig: C (Es blitzt, Muster aus feinen Rissen).\" data-om-slide-id=\"45c76491\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert mit einer CD in der Mikrowelle?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Sie schmilzt zu einer Pfütze<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Nichts — die CD ist aus Kunststoff<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Es blitzt, und zurück bleibt ein Muster aus feinen Rissen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Live\" data-screen-label=\"20\" data-speaker-notes=\"Versuch vorführen. Mikrowelle im Blick behalten.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">CD in Mikrowelle<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Auflösung\" data-screen-label=\"21\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Es blitzt, und zurück bleibt ein Muster aus feinen Rissen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Auf der CD liegt eine hauchdünne Aluminiumschicht. Die Mikrowellen erzeugen darin Strom, der nirgendwo hinkann. Die Schicht wird stellenweise so heiß, dass sie verdampft — es blitzt, und zurück bleibt ein verästeltes Muster.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Aufbau\" data-screen-label=\"22\" data-speaker-notes=\"Durchführung: Wasser und Stärke im Verhältnis 2:3 mischen und gut verrühren.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">6<\u002Fspan><h2 class=\"question setup-head\">Nicht-Newton'sche Flüssigkeit<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Wasser · Speisestärke · Schüssel<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 6 · Nicht-Newton'sche Flüssigkeit\" data-screen-label=\"23\" data-speaker-notes=\"Versuch 6 — Nicht-Newton'sche Flüssigkeit. Richtig: C (Beides).\" data-om-slide-id=\"b19b3fad\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Welche Konsistenz hat eine Mischung aus Stärke (3/5) und Wasser (2/5)?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Fest<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Flüssig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Beides<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Live\" data-screen-label=\"24\" data-speaker-notes=\"Kinder anfassen lassen: langsam eintauchen geht, schnell draufschlagen nicht.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Nicht-Newton'sche Flüssigkeit<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Auflösung\" data-screen-label=\"25\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Beides<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Warum das so ist konnte die Wissenschaft bis heute nicht zweifelsfrei belegen.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Aufbau\" data-screen-label=\"26\" data-speaker-notes=\"Durchführung: Das Teelicht wird auf einen mit Wasser gefüllt Teller gestellt und angezündet. Nachdem die Kerze sauber brennt wird das Glas darübergestellt. Die Kerze brennt weiter. Sobald sie ausgeht zieht sie Wasser in das Glas.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">7<\u002Fspan><h2 class=\"question setup-head\">Kerze im Glas<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Teller mit Wasser · Teelicht · Glas · Feuerzeug<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 7 · Kerze im Glas\" data-screen-label=\"27\" data-speaker-notes=\"Versuch 7 — Kerze im Glas. Richtig: B (Die ausgehende Kerze zieht Wasser in das Glas).\" data-om-slide-id=\"a0667170\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn man ein Glas über eine brennende Kerze stellt, die auf einem Teller mit Wasser steht?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Kerze geht einfach so aus<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Die ausgehende Kerze zieht Wasser in das Glas<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Die Kerze brennt aufgrund des verdampfenden Wasserstoffs weiter<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Live\" data-screen-label=\"28\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Kerze im Glas<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Auflösung\" data-screen-label=\"29\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Die ausgehende Kerze zieht Wasser in das Glas<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Durch den verbrennenden Sauerstoff entsteht ein Unterdruck im Glas, der das Wasser in das Glas hineinsaugt.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Aufbau\" data-screen-label=\"30\" data-speaker-notes=\"Durchführung: Wert der Waage muss mit Kamera festgehalten werden. Etwa einen fingerbreit Spiritus in das Glas geben, Deckel fest verschließen, Loch mit dem Finger verschließen und gut schütteln. Glas auf die Waage stellen, tarieren. Finger lösen und anzünden.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">8<\u002Fspan><h2 class=\"question setup-head\">Marmeladenglastriebwerk<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Spiritus · Marmeladenglas mit Raketendeckel · Feinwaage · Feuerzeug · Handyhalterung · Handy<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 8 · Marmeladenglastriebwerk\" data-screen-label=\"31\" data-speaker-notes=\"Versuch 8 — Schätzfrage. Schätzungen einsammeln, dann den Wert der Waage per Handykamera zeigen.\" data-om-slide-id=\"255bab2b\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie viel Schub erzeugt das gezeigte Triebwerk?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"answer answer-plain\">Schätzfrage — ruft eure Schätzung in Gramm<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Live\" data-screen-label=\"32\" data-speaker-notes=\"Waage per Handykamera auf die Leinwand.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Marmeladenglastriebwerk<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Auflösung\" data-screen-label=\"33\" data-speaker-notes=\"Gemessenen Wert eintragen — die Folie ist direkt editierbar.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Gemessen: ___ g<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Durch die Verbrennung der Spiritusdämpfe kommt es zu einem hohen Druck, der nur durch das kleine Loch entweichen kann. Dadurch entweicht das Gas mit hohem Druck und drückt das Glas nach unten.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Aufbau\" data-screen-label=\"34\" data-speaker-notes=\"Durchführung: Papier so oft falten wie möglich. Ein Kind nach vorne holen und falten lassen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">9<\u002Fspan><h2 class=\"question setup-head\">Papier falten<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Großes Papier<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 9 · Papier falten\" data-screen-label=\"35\" data-speaker-notes=\"Versuch 9 — Papier falten. Richtig: A (7 mal).\" data-om-slide-id=\"55850b27\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie oft kann man ein Stück Papier falten?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">7 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">14 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">So oft man möchte<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Live\" data-screen-label=\"36\" data-speaker-notes=\"Falten lassen und mitzählen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Papier falten<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Auflösung\" data-screen-label=\"37\" data-speaker-notes=\"Erklärung vorlesen. Fun Fact nicht vergessen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist A<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">7 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das Papier kann maximal 7 mal gefaltet werden. Danach wird wie Faltkante zu dick um es weiter zu falten, da der nach jedem Falten doppelt so hoch ist. Das gilt übrigens für jede Papiergröße.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V10 · Aufbau\" data-screen-label=\"38\" data-speaker-notes=\"Bonus, nur falls funktionsfähig.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">10<\u002Fspan><h2 class=\"question setup-head\">Plasmakanone<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\"><div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Bonus · nur falls funktionsfähig<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 10 · Plasmakanone\" data-screen-label=\"39\" data-speaker-notes=\"Versuch 10 — Bonus, nur falls funktionsfähig. Richtig: B (Der vierte Aggregatzustand).\" data-om-slide-id=\"a7d4dabd\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Plasma — was ist das eigentlich?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Ein besonders schweres Metall<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Der vierte Aggregatzustand, neben fest, flüssig und gasförmig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Eine Flüssigkeit, die von selbst leuchtet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  \n  <section class=\"slide\" data-label=\"V10 · Live\" data-screen-label=\"40\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Plasmakanone<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V10 · Auflösung\" data-screen-label=\"41\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Der vierte Aggregatzustand, neben fest, flüssig und gasförmig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Wird ein Gas stark genug erhitzt, lösen sich die Elektronen von den Atomen. Das Gas leitet dann Strom und leuchtet — genau wie im Blitz, in der Leuchtstoffröhre und in der Sonne.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;questionShadow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;redShade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rot #FF0000&quot;,&quot;Hellrot&quot;],&quot;default&quot;:&quot;Rot #FF0000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;showSafeArea&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    return {\n      shadowMode: p.questionShadow === false ? 'off' : 'on',\n      redMode: p.redShade === 'Hellrot' ? 'soft' : 'pure',\n      safeMode: p.showSafeArea ? 'on' : 'off',\n      animMode: p.animations === false ? 'off' : 'on',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
