ral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"76cf088b-831b-49c3-bd7c-5cd09ab0942b\"><\u002Fscript>\n<title>Quiz-Vorlage — 16:9<\u002Ftitle>\n\n\n<script>\n/* Der Bundler legt die inlinierte Logo-Datei unter window.__resources.cleverLogo ab;\n   die <image-slot>-Elemente bekommen ihre src daher zur Laufzeit gesetzt. */\n(function () {\n  function apply() {\n    var u = window.__resources && window.__resources.cleverLogo;\n    if (!u) return;\n    document.querySelectorAll('image-slot[src]').forEach(function (el) {\n      if (el.getAttribute('src').indexOf('uploads/') === 0) el.setAttribute('src', u);\n    });\n  }\n  var t = setInterval(apply, 300);\n  setTimeout(function () { clearInterval(t); }, 25000);\n})();\n<\u002Fscript>\n<style>\n/* 1920 x 1080 px = 33,87 x 19,05 cm. 1 cm = 56,7 px, Sicherheitsabstand 2 cm = 113 px. */\ndeck-stage {\n  --safe: 113px;\n  --type-question: 64px;\n  --type-answer: 42px;\n  --type-label: 26px;\n  --card-h: 113px;\n  --card-gap: 24px;\n  --radius-card: 20px;\n  --font-deck: \"Trebuchet MS\", \"Segoe UI\", Verdana, Arial, sans-serif;\n  --orange-top: #FEBF00;\n  --orange-bottom: #FF8800;\n  --box: #003366;\n  --a: #FF0000;\n  --b: #FFFF00;\n  --c: #00CC00;\n}\ndeck-stage[data-red=\"soft\"] { --a: #FF5A47; }\n.slide {\n  display: flex; flex-direction: column;\n  background: linear-gradient(180deg, #FFD84A 0%, var(--orange-top) 26%, var(--orange-bottom) 84%, #EF7800 100%);\n  color: #000000; font-family: var(--font-deck); text-wrap: pretty;\n  padding: var(--safe);\n  print-color-adjust: exact; -webkit-print-color-adjust: exact;\n}\ndeck-stage[data-safe=\"on\"] .slide::after {\n  content: \"\"; position: absolute; inset: var(--safe);\n  outline: 2px dashed rgba(0, 0, 0, 0.35); pointer-events: none;\n}\n\n/* — Titelfolie: das Bild läuft randlos in den Grund, weil der Verlauf dieselben\n     Orangetöne über dieselbe Höhe führt — 768 x 576 auf 1440 x 1080 skaliert. — */\n/* — Titelfolie: das Logo liegt mittig auf dem orangen Grund (520 x 208, auf 1200 x 480 skaliert). — */\n.title-slide { padding: 0; }\n.hero-image { position: absolute; left: 0; top: 156px; width: 1920px; height: 768px; }\n.hero-image image-slot { width: 100%; height: 100%; }\n\n/* — Frage- und Experimentfolie — */\n.logo-slot { flex: none; width: 283px; height: var(--card-h); }\n.logo-slot image-slot { width: 100%; height: 100%; }\n.question {\n  font-family: var(--font-deck); font-weight: 700; color: #000000;\n  font-size: var(--type-question); line-height: 1.22; margin: 56px 0 0;\n  max-width: 1560px; min-height: 234px; /* drei Zeilen reserviert — die Karten sitzen auf jeder Folie gleich */\n  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);\n}\ndeck-stage[data-shadow=\"off\"] .question { text-shadow: none; }\n.cards { display: flex; flex-direction: column; gap: var(--card-gap); margin-top: 64px; }\n.card-a {\n  display: flex; align-items: center; gap: 32px;\n  height: var(--card-h); padding: 0 40px; box-sizing: border-box;\n  background-color: var(--box);\n  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 58%);\n  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);\n  border-radius: var(--radius-card);\n  font-size: var(--type-answer); line-height: 1.25;\n}\n.dot {\n  flex: none; width: 76px; height: 76px; border-radius: 999px;\n  display: grid; place-items: center;\n  font-size: var(--type-answer); font-weight: 700; color: var(--box);\n}\n.dot-a { background: var(--a); }\n.dot-b { background: var(--b); }\n.dot-c { background: var(--c); }\n.answer { flex: 1; }\n.answer-a { color: var(--a); }\n.answer-b { color: var(--b); }\n.answer-c { color: var(--c); }\n.answer-plain { color: #FFFFFF; }\n.card-wide, .card-why { height: auto; min-height: var(--card-h); padding-top: 28px; padding-bottom: 28px; }\n.card-why { align-items: flex-start; line-height: 1.3; }\n.solution-head { min-height: 0; }\n.setup-head { min-height: 0; }\n\n/* — Fußbalken auf allen Folien außer der Titelfolie — */\n.slide:not(.title-slide)::before {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 56px;\n  background: var(--box);\n}\n\n/* — Aufbau-Folie: Nummer im Kreis neben dem Versuchsnamen — */\n.setup-row { display: flex; align-items: center; gap: 44px; margin: 56px 0 0; }\n.setup-row .question { margin: 0; }\n.num-circle {\n  flex: none; width: 140px; height: 140px; border-radius: 999px;\n  display: grid; place-items: center;\n  background: var(--box); color: #FFFFFF;\n  font-size: 80px; font-weight: 700; line-height: 1;\n  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);\n}\n\n/* — Live-Folie: große Ansage statt Karte — */\n.live-call { flex: 1; display: grid; place-items: center; padding-bottom: 56px; }\n.live-text {\n  font-size: 120px; font-weight: 700; color: #000000; text-align: center;\n  text-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);\n}\ndeck-stage[data-shadow=\"off\"] .live-text { text-shadow: none; }\n\n/* — Animationen: laufen nur auf der aktiven Folie und respektieren die\n     Systemeinstellung „Bewegung reduzieren“. Über die Tweaks abschaltbar. — */\n@media (prefers-reduced-motion: no-preference) {\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .logo-slot { animation: quizFade 0.4s ease-out both; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .num-circle,\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .live-text { animation: quizPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: 0.14s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .question { animation: quizRise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: 0.08s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .card-a { animation: quizRise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(1) { animation-delay: 0.20s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(2) { animation-delay: 0.32s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .cards .card-a:nth-child(3) { animation-delay: 0.44s; }\n  deck-stage:not([data-anim=\"off\"]) [data-deck-active] .title-slide image-slot { animation: quizPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }\n}\n@keyframes quizRise { from { opacity: 0; transform: translateY(22px); } }\n@keyframes quizFade { from { opacity: 0; } }\n@keyframes quizPop { from { opacity: 0; transform: scale(0.94); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"53a9ef6e-4301-4eff-8859-521ec3dd4151#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-shadow=\"{{ shadowMode }}\" data-red=\"{{ redMode }}\" data-safe=\"{{ safeMode }}\" data-anim=\"{{ animMode }}\" data-uneditable=\"\">\n\n  <section class=\"slide title-slide\" data-label=\"Titelfolie\" data-screen-label=\"01\" data-speaker-notes=\"Titelfolie mit clever!-Logo.\" data-om-slide-id=\"61b6c6d1\">\n    <div class=\"hero-image\">\n      \n    <\u002Fdiv>\n  <image-slot id=\"quiz-logo-titel\" shape=\"rect\" fit=\"contain\" src=\"4b7ad008-5631-440c-aa4a-943f7c6dc29c\" placeholder=\"Logo\" style=\"width: 2029px; height: 1133px\"><\u002Fimage-slot><\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Aufbau\" data-screen-label=\"02\" data-speaker-notes=\"Durchführung: Styroporstreifen in das Aceton drücken — sie lösen sich auf.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">1<\u002Fspan><h2 class=\"question setup-head\">Aceton und Styropor<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Glas mit Aceton · Styroporstreifen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Fragefolie · Beispiel\" data-screen-label=\"03\" data-speaker-notes=\"Beispielfolie. Frage maximal drei Zeilen, Antworttexte einzeilig halten.\" data-om-slide-id=\"d7ec491c\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-frage-1b\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn ein langer Streifen Styropor in Aceton getaucht wird?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Das Styropor dehnt sich aus und geht auf<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Es passiert nichts<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Styropor wird zu einer schleimartigen Masse<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Live\" data-screen-label=\"04\" data-speaker-notes=\"Versuch vorführen, Abstimmung steht.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Aceton und Styropor<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V1 · Auflösung\" data-screen-label=\"05\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s1\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Styropor wird zu einer schleimartigen Masse<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Styropor ist ein durch Treibmittel aufgeschäumter Kunststoff. Das Aceton löst die Bindungen zwischen den Kunststoffmolekülen auf und somit zersetzt sich das Styropor.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Aufbau\" data-screen-label=\"06\" data-speaker-notes=\"Durchführung: Zeigen: Seifenblock alleine schwimmt nicht. Einen Seifenblock in Essig legen (vorbereiten), einen Block Seife mit Salz bestreuen und einen Seife 20-30 Sekunden in die Mikrowelle stellen, anschließend sollte sie schwimmfähig sein.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">2<\u002Fspan><h2 class=\"question setup-head\">Seife<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Mikrowelle · ½ Seifenblöcke<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 2 · Seife\" data-screen-label=\"07\" data-speaker-notes=\"Versuch 2 — Seife. Richtig: B (In der Mikrowelle erhitzen).\" data-om-slide-id=\"d35cbac3\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie kann man ein Stück Seife zum Schwimmen bringen?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Seife in Essig einlegen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">In der Mikrowelle erhitzen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Stück Seife mit Salz bestreuen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Live\" data-screen-label=\"08\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Seife<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V2 · Auflösung\" data-screen-label=\"09\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s2\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">In der Mikrowelle erhitzen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das in der Seife enthaltene Wasser verdampft und die in der Seife enthaltene Luft dehnt sich aus. Beides zusammen bildet ein Luftpolster, das die Seife schwimmen lässt.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Aufbau\" data-screen-label=\"10\" data-speaker-notes=\"Durchführung: Die Trockenhefe in etwa 500ml lauwarmem Wasser in Becherglas auflösen, im Anschluss in Vase geben, die bereits in der Sicherheitskiste steht. In einem weiteren Becherglas die Lebensmittelfarbe, Spüli und Wasserstoffperoxid vermischen und im Anschluss zügig in die Vase geben.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">3<\u002Fspan><h2 class=\"question setup-head\">Elefantenzahnpasta<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">2 Päckchen Trockenhefe · 1 Päckchen Lebensmittelfarbe · 125 ml Wasserstoffperoxid · Spüli<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 3 · Elefantenzahnpasta\" data-screen-label=\"11\" data-speaker-notes=\"Versuch 3 — Elefantenzahnpasta. Richtig: B (Ein riesiger Schaumberg quillt aus der Vase).\" data-om-slide-id=\"05a22654\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn Hefe zu Wasserstoffperoxid mit Spüli kommt?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Mischung wird langsam fest<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Ein riesiger Schaumberg quillt aus der Vase<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Die Flüssigkeit färbt sich, sonst passiert nichts<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Live\" data-screen-label=\"12\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Elefantenzahnpasta<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V3 · Auflösung\" data-screen-label=\"13\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s3\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Ein riesiger Schaumberg quillt aus der Vase<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">In der Hefe steckt das Enzym Katalase. Es spaltet das Wasserstoffperoxid blitzschnell in Wasser und Sauerstoff auf. Das Spüli fängt den Sauerstoff als Schaum ein — deshalb quillt die Zahnpasta aus der Vase.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Aufbau\" data-screen-label=\"14\" data-speaker-notes=\"Durchführung: 2-3 Cola-Flaschen ca. 1/3 mit Wasser auffüllen. Dann Feuerzeuggas aus der Flasche in eine weitere Cola-Flasche geben. Im Anschluss das flüssige Gas in die Wasserflasche geben und rasch umdrehen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">4<\u002Fspan><h2 class=\"question setup-head\">Feuerzeuggas und Wasser<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">4 kleine Cola-Flaschen · 2 Flaschen Feuerzeuggas inkl. Zange · Wasser<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 4 · Feuerzeuggas und Wasser\" data-screen-label=\"15\" data-speaker-notes=\"Versuch 4 — Feuerzeuggas und Wasser. Richtig: A (Die Flasche fliegt weg wie eine Rakete).\" data-om-slide-id=\"f82061dc\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn man Feuerzeuggas in eine Flasche füllt, die zu ca. 1/3 mit Wasser gefüllt ist und die Flasche dann umdreht?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Flasche fliegt weg wie eine Rakete<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Das Gas verdampft, bevor etwas passieren kann<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Das Gas mischt sich mit dem Wasser und wird zu starkem Sprudel<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Live\" data-screen-label=\"16\" data-speaker-notes=\"Versuch vorführen. Sicherheitsabstand!\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Feuerzeuggas und Wasser<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V4 · Auflösung\" data-screen-label=\"17\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s4\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist A<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Flasche fliegt weg wie eine Rakete<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das Feuerzeuggas, welches aus reinem Butan besteht, ist bei Raumtemperatur gasförmig. Erst wenn es kälter als -1 Grad Celsius kalt ist, ist das Butan flüssig. Trifft das kalte, flüssige Gas beim umdrehen auf das wärmere Wasser und das Kohlendioxid im Wasser, verdampft das Butan explosionsartig und treibt die Rakete in die Höhe.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Aufbau\" data-screen-label=\"18\" data-speaker-notes=\"Durchführung: CD im Holzständer in die Mikrowelle stellen und abwarten, bis sie gebrannt ist.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">5<\u002Fspan><h2 class=\"question setup-head\">CD in Mikrowelle<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Mikrowelle · CD-Rohlinge · Holzklotz/Ständer<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 5 · CD in Mikrowelle\" data-screen-label=\"19\" data-speaker-notes=\"Versuch 5 — CD in Mikrowelle. Richtig: C (Es blitzt, Muster aus feinen Rissen).\" data-om-slide-id=\"45c76491\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert mit einer CD in der Mikrowelle?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Sie schmilzt zu einer Pfütze<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Nichts — die CD ist aus Kunststoff<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Es blitzt, und zurück bleibt ein Muster aus feinen Rissen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Live\" data-screen-label=\"20\" data-speaker-notes=\"Versuch vorführen. Mikrowelle im Blick behalten.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">CD in Mikrowelle<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V5 · Auflösung\" data-screen-label=\"21\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s5\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Es blitzt, und zurück bleibt ein Muster aus feinen Rissen<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Auf der CD liegt eine hauchdünne Aluminiumschicht. Die Mikrowellen erzeugen darin Strom, der nirgendwo hinkann. Die Schicht wird stellenweise so heiß, dass sie verdampft — es blitzt, und zurück bleibt ein verästeltes Muster.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Aufbau\" data-screen-label=\"22\" data-speaker-notes=\"Durchführung: Wasser und Stärke im Verhältnis 2:3 mischen und gut verrühren.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">6<\u002Fspan><h2 class=\"question setup-head\">Nicht-Newton'sche Flüssigkeit<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Wasser · Speisestärke · Schüssel<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 6 · Nicht-Newton'sche Flüssigkeit\" data-screen-label=\"23\" data-speaker-notes=\"Versuch 6 — Nicht-Newton'sche Flüssigkeit. Richtig: C (Beides).\" data-om-slide-id=\"b19b3fad\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Welche Konsistenz hat eine Mischung aus Stärke (3/5) und Wasser (2/5)?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Fest<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Flüssig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Beides<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Live\" data-screen-label=\"24\" data-speaker-notes=\"Kinder anfassen lassen: langsam eintauchen geht, schnell draufschlagen nicht.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Nicht-Newton'sche Flüssigkeit<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V6 · Auflösung\" data-screen-label=\"25\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s6\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist C<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Beides<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Warum das so ist konnte die Wissenschaft bis heute nicht zweifelsfrei belegen.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Aufbau\" data-screen-label=\"26\" data-speaker-notes=\"Durchführung: Das Teelicht wird auf einen mit Wasser gefüllt Teller gestellt und angezündet. Nachdem die Kerze sauber brennt wird das Glas darübergestellt. Die Kerze brennt weiter. Sobald sie ausgeht zieht sie Wasser in das Glas.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">7<\u002Fspan><h2 class=\"question setup-head\">Kerze im Glas<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Teller mit Wasser · Teelicht · Glas · Feuerzeug<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 7 · Kerze im Glas\" data-screen-label=\"27\" data-speaker-notes=\"Versuch 7 — Kerze im Glas. Richtig: B (Die ausgehende Kerze zieht Wasser in das Glas).\" data-om-slide-id=\"a0667170\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Was passiert, wenn man ein Glas über eine brennende Kerze stellt, die auf einem Teller mit Wasser steht?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Die Kerze geht einfach so aus<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Die ausgehende Kerze zieht Wasser in das Glas<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Die Kerze brennt aufgrund des verdampfenden Wasserstoffs weiter<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Live\" data-screen-label=\"28\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Kerze im Glas<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V7 · Auflösung\" data-screen-label=\"29\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s7\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Die ausgehende Kerze zieht Wasser in das Glas<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Durch den verbrennenden Sauerstoff entsteht ein Unterdruck im Glas, der das Wasser in das Glas hineinsaugt.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Aufbau\" data-screen-label=\"30\" data-speaker-notes=\"Durchführung: Wert der Waage muss mit Kamera festgehalten werden. Etwa einen fingerbreit Spiritus in das Glas geben, Deckel fest verschließen, Loch mit dem Finger verschließen und gut schütteln. Glas auf die Waage stellen, tarieren. Finger lösen und anzünden.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">8<\u002Fspan><h2 class=\"question setup-head\">Marmeladenglastriebwerk<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Spiritus · Marmeladenglas mit Raketendeckel · Feinwaage · Feuerzeug · Handyhalterung · Handy<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 8 · Marmeladenglastriebwerk\" data-screen-label=\"31\" data-speaker-notes=\"Versuch 8 — Schätzfrage. Schätzungen einsammeln, dann den Wert der Waage per Handykamera zeigen.\" data-om-slide-id=\"255bab2b\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie viel Schub erzeugt das gezeigte Triebwerk?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"answer answer-plain\">Schätzfrage — ruft eure Schätzung in Gramm<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Live\" data-screen-label=\"32\" data-speaker-notes=\"Waage per Handykamera auf die Leinwand.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Marmeladenglastriebwerk<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V8 · Auflösung\" data-screen-label=\"33\" data-speaker-notes=\"Gemessenen Wert eintragen — die Folie ist direkt editierbar.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s8\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Gemessen: ___ g<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Durch die Verbrennung der Spiritusdämpfe kommt es zu einem hohen Druck, der nur durch das kleine Loch entweichen kann. Dadurch entweicht das Gas mit hohem Druck und drückt das Glas nach unten.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Aufbau\" data-screen-label=\"34\" data-speaker-notes=\"Durchführung: Papier so oft falten wie möglich. Ein Kind nach vorne holen und falten lassen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">9<\u002Fspan><h2 class=\"question setup-head\">Papier falten<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\">\n      <div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Großes Papier<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 9 · Papier falten\" data-screen-label=\"35\" data-speaker-notes=\"Versuch 9 — Papier falten. Richtig: A (7 mal).\" data-om-slide-id=\"55850b27\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Wie oft kann man ein Stück Papier falten?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">7 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">14 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">So oft man möchte<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Live\" data-screen-label=\"36\" data-speaker-notes=\"Falten lassen und mitzählen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Papier falten<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V9 · Auflösung\" data-screen-label=\"37\" data-speaker-notes=\"Erklärung vorlesen. Fun Fact nicht vergessen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s9\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist A<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">7 mal<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Das Papier kann maximal 7 mal gefaltet werden. Danach wird wie Faltkante zu dick um es weiter zu falten, da der nach jedem Falten doppelt so hoch ist. Das gilt übrigens für jede Papiergröße.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V10 · Aufbau\" data-screen-label=\"38\" data-speaker-notes=\"Bonus, nur falls funktionsfähig.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-a10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"setup-row\"><span class=\"num-circle\">10<\u002Fspan><h2 class=\"question setup-head\">Plasmakanone<\u002Fh2><\u002Fdiv>\n    <div class=\"cards\"><div class=\"card-a card-wide\"><span class=\"answer answer-plain\">Bonus · nur falls funktionsfähig<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"Frage 10 · Plasmakanone\" data-screen-label=\"39\" data-speaker-notes=\"Versuch 10 — Bonus, nur falls funktionsfähig. Richtig: B (Der vierte Aggregatzustand).\" data-om-slide-id=\"a7d4dabd\">\n    <div class=\"logo-slot\">\n      <image-slot id=\"quiz-logo-f10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <h2 class=\"question\">Plasma — was ist das eigentlich?<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-a\">A<\u002Fspan><span class=\"answer answer-a\">Ein besonders schweres Metall<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Der vierte Aggregatzustand, neben fest, flüssig und gasförmig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a\"><span class=\"dot dot-c\">C<\u002Fspan><span class=\"answer answer-c\">Eine Flüssigkeit, die von selbst leuchtet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  \n  <section class=\"slide\" data-label=\"V10 · Live\" data-screen-label=\"40\" data-speaker-notes=\"Versuch vorführen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-l10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question\">Plasmakanone<\u002Fh2>\n    <div class=\"live-call\"><span class=\"live-text\">Schaut genau hin!<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"slide\" data-label=\"V10 · Auflösung\" data-screen-label=\"41\" data-speaker-notes=\"Erklärung vorlesen.\">\n    <div class=\"logo-slot\"><image-slot id=\"quiz-logo-s10\" shape=\"rect\" fit=\"contain\" src=\"26bde9e8-6663-4747-b361-1d0bfb992e8f\" placeholder=\"Logo\"><\u002Fimage-slot><\u002Fdiv>\n    <h2 class=\"question solution-head\">Richtig ist B<\u002Fh2>\n    <div class=\"cards\">\n      <div class=\"card-a\"><span class=\"dot dot-b\">B<\u002Fspan><span class=\"answer answer-b\">Der vierte Aggregatzustand, neben fest, flüssig und gasförmig<\u002Fspan><\u002Fdiv>\n      <div class=\"card-a card-why\"><span class=\"answer answer-plain\">Wird ein Gas stark genug erhitzt, lösen sich die Elektronen von den Atomen. Das Gas leitet dann Strom und leuchtet — genau wie im Blitz, in der Leuchtstoffröhre und in der Sonne.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;questionShadow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;redShade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rot #FF0000&quot;,&quot;Hellrot&quot;],&quot;default&quot;:&quot;Rot #FF0000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vorlage&quot;},&quot;showSafeArea&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vorlage&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    return {\n      shadowMode: p.questionShadow === false ? 'off' : 'on',\n      redMode: p.redShade === 'Hellrot' ? 'soft' : 'pure',\n      safeMode: p.showSafeArea ? 'on' : 'off',\n      animMode: p.animations === false ? 'off' : 'on',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<script>
/* ── Punktezähler + Moderatoransicht ────────────────────────────────────
   Dieses Fenster ist die Beameransicht. Über den Knopf unten rechts öffnet
   sich ein zweites Fenster als Moderatoransicht; das schiebst du auf deinen
   Laptop-Bildschirm, die Folien bleiben auf dem Beamer.

   Das Moderatorfenster wird komplett von hier aus aufgebaut, deshalb laufen
   alle Handler in diesem JS-Kontext — kein BroadcastChannel, kein
   localStorage-Sync, nichts, was bei file:// wackelt.

   Der Bundler tauscht beim Entpacken das documentElement aus, darum hängt
   sich das Overlay per Intervall wieder ein. Das UI steckt in einem Shadow
   Root, damit Deck-CSS und dieses UI sich nicht gegenseitig überschreiben. */
(function () {
  var QUESTIONS = [
    {n:1,titel:"Aceton und Styropor",right:"C",pts:1},
    {n:2,titel:"Seife",right:"B",pts:1},
    {n:3,titel:"Elefantenzahnpasta",right:"B",pts:1},
    {n:4,titel:"Feuerzeuggas und Wasser",right:"A",pts:1},
    {n:5,titel:"CD in Mikrowelle",right:"C",pts:1},
    {n:6,titel:"Nicht-Newton'sche Flüssigkeit",right:"C",pts:1},
    {n:7,titel:"Kerze im Glas",right:"B",pts:1},
    {n:8,titel:"Marmeladenglastriebwerk",right:null,schaetz:true,pts:2},
    {n:9,titel:"Papier falten",right:"A",pts:1},
    {n:10,titel:"Plasmakanone (Bonus)",right:"B",pts:2}
  ];
  function Q(n){ for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].n===n) return QUESTIONS[i]; return null; }

  var KEY="clever-punkte-v1", canStore=true;
  var S={groups:["Gruppe 1","Gruppe 2","Gruppe 3"],answers:{},est:{},measured:"",pts:{},cur:1,open:false,board:false,present:false};
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k];}}catch(e){canStore=false;}
  QUESTIONS.forEach(function(q){ if(S.pts[q.n]==null) S.pts[q.n]=q.pts; });
  S.open=false; S.board=false; S.present=false;
  function save(){ if(!canStore) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canStore=false;} }

  /* ── Punktelogik ───────────────────────────────────────────────────── */
  function closest(){
    var m=parseFloat(String(S.measured).replace(',','.'));
    if(isNaN(m)) return [];
    var best=Infinity,win=[];
    S.groups.forEach(function(_,gi){
      var v=parseFloat(String(S.est[gi]==null?'':S.est[gi]).replace(',','.'));
      if(isNaN(v)) return;
      var d=Math.abs(v-m);
      if(d<best-1e-9){best=d;win=[gi];} else if(Math.abs(d-best)<1e-9) win.push(gi);
    });
    return win;
  }
  function score(gi){
    var s=0;
    QUESTIONS.forEach(function(q){
      var p=Number(S.pts[q.n])||0;
      if(q.schaetz){ if(S.measured!=="" && closest().indexOf(gi)>=0) s+=p; }
      else if((S.answers[q.n]||{})[gi]===q.right) s+=p;
    });
    return s;
  }
  function ranked(){
    var l=S.groups.map(function(n,i){return {name:n||('Gruppe '+(i+1)),p:score(i),i:i};});
    l.sort(function(a,b){return b.p-a.p;});
    var rank=0,last=null,shown=0;
    l.forEach(function(g){shown++; if(g.p!==last){rank=shown;last=g.p;} g.rank=rank;});
    return l;
  }
  function exportCsv(doc){
    var head=['Gruppe'].concat(QUESTIONS.map(function(q){return 'F'+q.n;})).concat(['Summe']);
    var rows=S.groups.map(function(n,i){
      var cells=QUESTIONS.map(function(q){return q.schaetz?(S.est[i]==null?'':S.est[i]):((S.answers[q.n]||{})[i]||'');});
      return [n||('Gruppe '+(i+1))].concat(cells).concat([score(i)]);
    });
    var txt=[head].concat(rows).map(function(r){
      return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');
    }).join('\r\n');
    var blob=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
    var a=(doc||document).createElement('a');
    a.href=URL.createObjectURL(blob); a.download='clever-punkte.csv'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }

  /* ── Deck-Zugriff ──────────────────────────────────────────────────── */
  function deck(){ return document.querySelector('deck-stage'); }
  function slides(){
    var d=deck(); if(!d) return [];
    return Array.prototype.filter.call(d.children,function(el){
      return el.tagName!=='TEMPLATE'&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE';
    });
  }
  /* Folie -> Frage: Label beginnt mit "V<n> ·" oder "Frage <n> ·". Folien
     ohne eigene Nummer erben die zuletzt gesehene. */
  function qOfSlide(i){
    var ss=slides(),cur=null;
    for(var x=0;x<=i&&x<ss.length;x++){
      var lb=ss[x].getAttribute('data-label')||'';
      var m=lb.match(/^V(\d+)/)||lb.match(/Frage\s*(\d+)/);
      if(m) cur=parseInt(m[1],10);
    }
    return cur;
  }
  function slideInfo(i){
    var ss=slides(); if(i<0||i>=ss.length) return null;
    var s=ss[i];
    var qEl=s.querySelector('.question');
    var ans=Array.prototype.map.call(s.querySelectorAll('.answer'),function(a){return a.textContent.trim();});
    return {
      label:s.getAttribute('data-label')||('Folie '+(i+1)),
      notes:s.getAttribute('data-speaker-notes')||'',
      question:qEl?qEl.textContent.trim():'',
      answers:ans
    };
  }

  /* ── Beameransicht: Knopf + Punktestand ────────────────────────────── */
  var host=null,root=null;
  var CSS_B=[
    ':host{all:initial}',
    '*{margin:0;padding:0;box-sizing:border-box;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif}',
    'button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 14px;background:#003366;color:#fff;font-weight:700}',
    'button:focus-visible{outline:3px solid #FEBF00;outline-offset:2px}',
    'button.g{background:rgba(255,255,255,.94);color:#003366}',
    '.fab{position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;gap:8px}',
    '.fab button{box-shadow:0 4px 18px rgba(0,0,0,.5)}',
    'button.hot{background:#FF8800;color:#12233A}',
    '.board{position:fixed;inset:0;z-index:2147483001;background:linear-gradient(180deg,#FEBF00,#FF8800 70%,#EF7800);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:5vh 5vw}',
    '.board h2{font-size:clamp(30px,5vw,66px);color:#003366;margin-bottom:1vh}',
    '.brow{width:min(1050px,92vw);display:grid;grid-template-columns:1.5em 1fr auto;align-items:center;gap:3vw;background:rgba(255,255,255,.95);border-radius:14px;padding:1.5vh 3vw;border-left:12px solid #003366}',
    '.brow.p1{border-left-color:#FEBF00}.brow.p2{border-left-color:#B9C2CC}.brow.p3{border-left-color:#C8853B}',
    '.brk{font-size:clamp(20px,3vw,40px);font-weight:800;color:#003366;opacity:.5}',
    '.bnm{font-size:clamp(20px,3.2vw,44px);font-weight:700;color:#003366;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
    '.bpt{font-size:clamp(24px,4vw,56px);font-weight:800;color:#FF8800}'
  ].join('');

  /* Folienleiste + Editor-Chrome aus/an. Das Deck hört auf diese Nachricht. */
  function presenting(on){
    try{ window.postMessage({__omelette_presenting:!!on},'*'); }catch(e){}
  }

  function renderBeamer(){
    if(!root) return;
    root.innerHTML='';
    var st=document.createElement('style'); st.textContent=CSS_B; root.appendChild(st);
    if(S.board){
      var b=document.createElement('div'); b.className='board';
      var h=document.createElement('h2'); h.textContent='Punktestand'; b.appendChild(h);
      ranked().forEach(function(g){
        var r=document.createElement('div');
        r.className='brow'+(g.rank===1?' p1':g.rank===2?' p2':g.rank===3?' p3':'');
        var a=document.createElement('div'); a.className='brk'; a.textContent=g.rank;
        var c=document.createElement('div'); c.className='bnm'; c.textContent=g.name;
        var d=document.createElement('div'); d.className='bpt'; d.textContent=g.p;
        r.appendChild(a); r.appendChild(c); r.appendChild(d); b.appendChild(r);
      });
      root.appendChild(b);
      return;
    }
    if(pWin && !pWin.closed) return;           // Moderatorfenster offen: Beamer bleibt sauber
    var bar=document.createElement('div'); bar.className='fab';
    var f1=document.createElement('button'); f1.className='hot';
    f1.textContent='Moderatoransicht öffnen'; f1.onclick=openPresenter;
    var f2=document.createElement('button'); f2.className='g';
    f2.textContent=S.present?'Folienleiste ein':'Folienleiste aus';
    f2.onclick=function(){ S.present=!S.present; save(); presenting(S.present); renderBeamer(); };
    bar.appendChild(f1); bar.appendChild(f2);
    root.appendChild(bar);
  }
  function mount(){
    if(host&&host.isConnected) return;
    if(!document.body) return;
    host=document.createElement('div');
    host.id='clever-punkte-host';
    host.style.cssText='all:initial;position:static';
    root=host.attachShadow({mode:'open'});
    document.body.appendChild(host);
    renderBeamer();
  }

  /* ── Moderatorfenster ──────────────────────────────────────────────── */
  var pWin=null,pRoot=null,lastIdx=-1;
  var CSS_P=[
    '*{margin:0;padding:0;box-sizing:border-box;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif}',
    'body{background:#0E1B2A;color:#E9EEF4;padding:14px}',
    'button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 14px;background:#1F6FB2;color:#fff;font-weight:700}',
    'button:hover{filter:brightness(1.15)}',
    'button:focus-visible{outline:3px solid #FEBF00;outline-offset:2px}',
    'button.g{background:#26364A}',
    'button.r{background:#8A1B15}',
    'button:disabled{opacity:.4;cursor:default}',
    '.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}',
    '.pos{font-size:20px;font-weight:800;color:#FEBF00}',
    '.sp{flex:1}',
    '.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}',
    '.card{background:#16273B;border-radius:12px;padding:14px}',
    '.card h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#8FA6BD;margin-bottom:8px}',
    '.lbl{font-size:15px;color:#FEBF00;font-weight:700;margin-bottom:6px}',
    '.qq{font-size:21px;font-weight:700;line-height:1.35;margin-bottom:10px}',
    '.ans{padding:6px 9px;border-radius:8px;margin-bottom:4px;font-size:15px;background:#1E3350;line-height:1.35}',
    '.notes{font-size:15px;line-height:1.5;color:#CBD8E6;white-space:pre-wrap}',
    '.next{margin-top:10px;font-size:13px;color:#8FA6BD}',
    '.grow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09)}',
    '.gnm{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
    '.pk{display:flex;gap:5px}',
    '.pk button{width:42px;height:36px;padding:0;background:#26364A;font-weight:800}',
    '.pk button.on[data-k="A"]{background:#E5322B}',
    '.pk button.on[data-k="B"]{background:#F2C300;color:#3A2E00}',
    '.pk button.on[data-k="C"]{background:#12A63A}',
    '.tag{width:34px;text-align:right;font-weight:800;font-size:13px;color:#5FD37E}',
    '.tag.no{color:#FF8B84;opacity:.6}',
    '.right{font-size:14px;color:#5FD37E;font-weight:700;margin-bottom:8px}',
    'input.t{font:inherit;background:#0E1B2A;color:#E9EEF4;border:2px solid #2C3F55;border-radius:8px;padding:6px}',
    'input.num{width:96px}',
    '.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}',
    '.chip{display:flex;align-items:center;background:#0E1B2A;border:2px solid #2C3F55;border-radius:9px;padding:3px 5px}',
    '.chip input{font:inherit;background:transparent;border:none;color:#E9EEF4;width:104px;font-weight:700}',
    '.chip input:focus{outline:none;border-bottom:2px solid #FEBF00}',
    '.chip .x{background:transparent;color:#FF8B84;padding:2px 5px}',
    '.stand{display:grid;grid-template-columns:1.4em 1fr auto;gap:8px;font-size:15px;padding:4px 0}',
    '.stand b{color:#FEBF00}',
    '.hint{font-size:12px;color:#8FA6BD;line-height:1.5;margin-top:8px}',
    '.warn{background:#8A1B15;border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px}'
  ].join('');

  function openPresenter(){
    pWin=window.open('','cleverPresenter','width=1180,height=820');
    if(!pWin){ alert('Das Moderatorfenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben.'); return; }
    pWin.document.open();
    pWin.document.write('<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Moderatoransicht</title></head><body></body></html>');
    pWin.document.close();
    var st=pWin.document.createElement('style'); st.textContent=CSS_P;
    pWin.document.head.appendChild(st);
    pRoot=pWin.document.body;
    pWin.addEventListener('keydown',function(e){
      if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
      var d=deck(); if(!d) return;
      if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ d.next(); e.preventDefault(); }
      if(e.key==='ArrowLeft'||e.key==='PageUp'){ d.prev(); e.preventDefault(); }
    });
    pWin.addEventListener('beforeunload',function(){ pWin=null; S.present=false; save(); presenting(false); renderBeamer(); });
    lastIdx=-1;
    S.present=true; save(); presenting(true);
    renderPresenter();
    renderBeamer();
  }

  function renderPresenter(){
    if(!pWin||pWin.closed||!pRoot) return;
    var D=pWin.document, d=deck();
    pRoot.innerHTML='';
    function E(t,c,x){var e=D.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}

    var idx=d?d.index:0, total=d?d.length:0;
    var qn=qOfSlide(idx), q=qn?Q(qn):null;
    if(q) S.cur=q.n;

    var top=E('div','top');
    top.appendChild(E('span','pos','Folie '+(idx+1)+' / '+total));
    var bp=E('button','g','◀ Zurück'); bp.disabled=!d||idx<=0; bp.onclick=function(){d.prev();};
    var bn=E('button',null,'Weiter ▶'); bn.disabled=!d||idx>=total-1; bn.onclick=function(){d.next();};
    top.appendChild(bp); top.appendChild(bn);
    top.appendChild(E('span','sp'));
    var bb=E('button',S.board?'r':'g',S.board?'Punktestand ausblenden':'Punktestand auf Beamer');
    bb.onclick=function(){ S.board=!S.board; save(); renderBeamer(); renderPresenter(); };
    top.appendChild(bb);
    var bc=E('button','g','CSV'); bc.onclick=function(){exportCsv(D);}; top.appendChild(bc);
    pRoot.appendChild(top);

    if(!canStore) pRoot.appendChild(E('div','warn','Kein Speicher verfügbar — Stand geht beim Neuladen verloren. Vorher CSV sichern.'));

    var cols=E('div','cols');

    /* links: Folie + Notiz */
    var L=E('div','card');
    var info=slideInfo(idx)||{label:'—',notes:'',question:'',answers:[]};
    L.appendChild(E('h3',null,'Aktuelle Folie'));
    L.appendChild(E('div','lbl',info.label));
    if(info.question) L.appendChild(E('div','qq',info.question));
    info.answers.forEach(function(a){ L.appendChild(E('div','ans',a)); });
    if(info.notes){
      L.appendChild(E('h3',null,'Notiz')); L.appendChild(E('div','notes',info.notes));
    }
    var nx=slideInfo(idx+1);
    L.appendChild(E('div','next', nx?('Als Nächstes: '+nx.label):'Letzte Folie'));
    cols.appendChild(L);

    /* rechts: Punkte */
    var R=E('div','card');
    R.appendChild(E('h3',null,'Punkte'));
    if(!q){
      R.appendChild(E('div','notes','Diese Folie gehört zu keiner Frage.'));
    } else {
      R.appendChild(E('div','lbl','Frage '+q.n+' · '+q.titel));
      R.appendChild(E('div','right', q.schaetz?'Richtig: die nächste Schätzung':'Richtig: '+q.right));

      var pl=E('div'); pl.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:10px';
      pl.appendChild(E('span','hint','Punkte:'));
      var pin=D.createElement('input'); pin.type='number'; pin.min='0'; pin.className='t num';
      pin.style.width='70px'; pin.value=S.pts[q.n];
      pin.setAttribute('aria-label','Punkte für Frage '+q.n);
      pin.oninput=function(){ S.pts[q.n]=pin.value===''?0:Number(pin.value); save(); renderStand(); renderBeamer(); };
      pl.appendChild(pin); R.appendChild(pl);

      S.groups.forEach(function(name,gi){
        var r=E('div','grow');
        r.appendChild(E('div','gnm',name||('Gruppe '+(gi+1))));
        if(q.schaetz){
          var inp=D.createElement('input'); inp.className='t num'; inp.inputMode='decimal';
          inp.value=S.est[gi]==null?'':S.est[gi]; inp.placeholder='Gramm';
          inp.setAttribute('aria-label','Schätzung '+name);
          inp.oninput=function(){ S.est[gi]=inp.value; save(); renderPresenter(); renderBeamer(); };
          r.appendChild(inp);
          var t=E('div','tag');
          if(S.measured!==""){ var w=closest().indexOf(gi)>=0; t.textContent=w?'+'+(Number(S.pts[q.n])||0):'0'; if(!w)t.className='tag no'; }
          r.appendChild(t);
        } else {
          var pk=E('div','pk');
          ['A','B','C'].forEach(function(kk){
            var b=E('button',null,kk); b.dataset.k=kk;
            b.setAttribute('aria-label',(name||'Gruppe')+' antwortet '+kk);
            if((S.answers[q.n]||{})[gi]===kk) b.classList.add('on');
            b.onclick=function(){
              S.answers[q.n]=S.answers[q.n]||{};
              if(S.answers[q.n][gi]===kk) delete S.answers[q.n][gi]; else S.answers[q.n][gi]=kk;
              save(); renderPresenter(); renderBeamer();
            };
            pk.appendChild(b);
          });
          r.appendChild(pk);
          var got=(S.answers[q.n]||{})[gi], t2=E('div','tag');
          if(got){ var ok=got===q.right; t2.textContent=ok?'+'+(Number(S.pts[q.n])||0):'0'; if(!ok)t2.className='tag no'; }
          r.appendChild(t2);
        }
        R.appendChild(r);
      });

      if(q.schaetz){
        var mb=E('div'); mb.style.cssText='display:flex;align-items:center;gap:8px;margin-top:10px';
        mb.appendChild(E('span','hint','Gemessen (g):'));
        var mi=D.createElement('input'); mi.className='t num'; mi.inputMode='decimal'; mi.value=S.measured;
        mi.setAttribute('aria-label','Gemessener Wert in Gramm');
        mi.oninput=function(){ S.measured=mi.value; save(); renderPresenter(); renderBeamer(); };
        mb.appendChild(mi); R.appendChild(mb);
        R.appendChild(E('div','hint','Kleinste Abweichung bekommt die Punkte, bei Gleichstand alle Gleichnahen.'));
      }
    }

    /* Gruppen */
    R.appendChild(E('h3',null,'Gruppen'));
    var chips=E('div','chips');
    S.groups.forEach(function(name,i){
      var c=E('div','chip');
      var inp=D.createElement('input'); inp.value=name; inp.setAttribute('aria-label','Name Gruppe '+(i+1));
      inp.oninput=function(){ S.groups[i]=inp.value; save(); renderStand(); renderBeamer(); };
      var x=E('button','x','×'); x.title='Gruppe entfernen';
      x.onclick=function(){
        S.groups.splice(i,1);
        Object.keys(S.answers).forEach(function(qn2){
          var a=S.answers[qn2],out={};
          Object.keys(a).forEach(function(kk){var ki=+kk; if(ki<i)out[ki]=a[kk]; else if(ki>i)out[ki-1]=a[kk];});
          S.answers[qn2]=out;
        });
        var e2={}; Object.keys(S.est).forEach(function(kk){var ki=+kk; if(ki<i)e2[ki]=S.est[kk]; else if(ki>i)e2[ki-1]=S.est[kk];});
        S.est=e2; save(); renderPresenter(); renderBeamer();
      };
      c.appendChild(inp); c.appendChild(x); chips.appendChild(c);
    });
    R.appendChild(chips);
    var add=E('button','g','Gruppe hinzufügen');
    add.onclick=function(){ S.groups.push('Gruppe '+(S.groups.length+1)); save(); renderPresenter(); renderBeamer(); };
    var rst=E('button','r','Zurücksetzen'); rst.style.marginLeft='6px';
    rst.onclick=function(){
      if(!pWin.confirm('Alle Antworten und Punkte löschen? Gruppennamen bleiben.')) return;
      S.answers={};S.est={};S.measured='';
      QUESTIONS.forEach(function(qq){S.pts[qq.n]=qq.pts;});
      save(); renderPresenter(); renderBeamer();
    };
    R.appendChild(add); R.appendChild(rst);

    /* Stand */
    R.appendChild(E('h3',null,'Stand'));
    var standBox=E('div'); standBox.id='stand'; R.appendChild(standBox);
    function renderStand(){
      standBox.innerHTML='';
      ranked().forEach(function(g){
        var row=E('div','stand');
        row.appendChild(E('span',null,g.rank+'.'));
        row.appendChild(E('span',null,g.name));
        var b=D.createElement('b'); b.textContent=g.p; row.appendChild(b);
        standBox.appendChild(row);
      });
    }
    renderStand();
    R.appendChild(E('div','hint','Pfeiltasten in diesem Fenster blättern die Folien auf dem Beamer.'));
    cols.appendChild(R);
    pRoot.appendChild(cols);
  }

  /* Folienwechsel am Beamer spiegeln */
  setInterval(function(){
    var d=deck();
    if(pWin&&pWin.closed){ pWin=null; S.present=false; save(); presenting(false); renderBeamer(); }
    if(!d||!pWin) return;
    if(d.index!==lastIdx){ lastIdx=d.index; renderPresenter(); }
  },200);

  setInterval(mount,250);
  if(document.readyState!=='loading') mount();
  else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

</body>
</html>
