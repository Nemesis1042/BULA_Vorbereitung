    {n:9,titel:"Papier falten",right:"A",pts:1},
    {n:10,titel:"Plasmakanone (Bonus)",right:"B",pts:2}
  ];
  function Q(n){ for(var i=0;i<QUESTIONS.length;i++) if(QUESTIONS[i].n===n) return QUESTIONS[i]; return null; }

  var KEY="clever-punkte-v1", canStore=true;
  var S={groups:["Gruppe 1","Gruppe 2","Gruppe 3"],answers:{},est:{},measured:"",pts:{},cur:1,open:false,board:false,present:false};
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k];}}catch(e){canStore=false;}
  QUESTIONS.forEach(function(q){ if(S.pts[q.n]==null) S.pts[q.n]=q.pts; });
  S.open=false; S.board=false; S.present=false;
  function save(){ if(!canStore) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canStore=false;} }

  /* ── Punktelogik ───────────────────────────────────────────────────── */
  function closest(){
    var m=parseFloat(String(S.measured).replace(',','.'));
    if(isNaN(m)) return [];
    var best=Infinity,win=[];
    S.groups.forEach(function(_,gi){
      var v=parseFloat(String(S.est[gi]==null?'':S.est[gi]).replace(',','.'));
      if(isNaN(v)) return;
      var d=Math.abs(v-m);
      if(d<best-1e-9){best=d;win=[gi];} else if(Math.abs(d-best)<1e-9) win.push(gi);
    });
    return win;
  }
  function score(gi){
    var s=0;
    QUESTIONS.forEach(function(q){
      var p=Number(S.pts[q.n])||0;
      if(q.schaetz){ if(S.measured!=="" && closest().indexOf(gi)>=0) s+=p; }
      else if((S.answers[q.n]||{})[gi]===q.right) s+=p;
    });
    return s;
  }
  function ranked(){
    var l=S.groups.map(function(n,i){return {name:n||('Gruppe '+(i+1)),p:score(i),i:i};});
    l.sort(function(a,b){return b.p-a.p;});
    var rank=0,last=null,shown=0;
    l.forEach(function(g){shown++; if(g.p!==last){rank=shown;last=g.p;} g.rank=rank;});
    return l;
  }
  function exportCsv(doc){
    var head=['Gruppe'].concat(QUESTIONS.map(function(q){return 'F'+q.n;})).concat(['Summe']);
    var rows=S.groups.map(function(n,i){
      var cells=QUESTIONS.map(function(q){return q.schaetz?(S.est[i]==null?'':S.est[i]):((S.answers[q.n]||{})[i]||'');});
      return [n||('Gruppe '+(i+1))].concat(cells).concat([score(i)]);
    });
    var txt=[head].concat(rows).map(function(r){
      return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');
    }).join('\r\n');
    var blob=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
    var a=(doc||document).createElement('a');
    a.href=URL.createObjectURL(blob); a.download='clever-punkte.csv'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }

  /* ── Deck-Zugriff ──────────────────────────────────────────────────── */
  function deck(){ return document.querySelector('deck-stage'); }
  function slides(){
    var d=deck(); if(!d) return [];
    return Array.prototype.filter.call(d.children,function(el){
      return el.tagName!=='TEMPLATE'&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE';
    });
  }
  /* Folie -> Frage: Label beginnt mit "V<n> ·" oder "Frage <n> ·". Folien
     ohne eigene Nummer erben die zuletzt gesehene. */
  function qOfSlide(i){
    var ss=slides(),cur=null;
    for(var x=0;x<=i&&x<ss.length;x++){
      var lb=ss[x].getAttribute('data-label')||'';
      var m=lb.match(/^V(\d+)/)||lb.match(/Frage\s*(\d+)/);
      if(m) cur=parseInt(m[1],10);
    }
    return cur;
  }
  function slideInfo(i){
    var ss=slides(); if(i<0||i>=ss.length) return null;
    var s=ss[i];
    var qEl=s.querySelector('.question');
    var ans=Array.prototype.map.call(s.querySelectorAll('.answer'),function(a){return a.textContent.trim();});
    return {
      label:s.getAttribute('data-label')||('Folie '+(i+1)),
      notes:s.getAttribute('data-speaker-notes')||'',
      question:qEl?qEl.textContent.trim():'',
      answers:ans
    };
  }

  /* ── Beameransicht: Knopf + Punktestand ────────────────────────────── */
  var host=null,root=null;
  var CSS_B=[
    ':host{all:initial}',
    '*{margin:0;padding:0;box-sizing:border-box;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif}',
    'button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 14px;background:#003366;color:#fff;font-weight:700}',
    'button:focus-visible{outline:3px solid #FEBF00;outline-offset:2px}',
    'button.g{background:rgba(255,255,255,.94);color:#003366}',
    '.fab{position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;gap:8px}',
    '.fab button{box-shadow:0 4px 18px rgba(0,0,0,.5)}',
    'button.hot{background:#FF8800;color:#12233A}',
    '.board{position:fixed;inset:0;z-index:2147483001;background:linear-gradient(180deg,#FEBF00,#FF8800 70%,#EF7800);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:5vh 5vw}',
    '.board h2{font-size:clamp(30px,5vw,66px);color:#003366;margin-bottom:1vh}',
    '.brow{width:min(1050px,92vw);display:grid;grid-template-columns:1.5em 1fr auto;align-items:center;gap:3vw;background:rgba(255,255,255,.95);border-radius:14px;padding:1.5vh 3vw;border-left:12px solid #003366}',
    '.brow.p1{border-left-color:#FEBF00}.brow.p2{border-left-color:#B9C2CC}.brow.p3{border-left-color:#C8853B}',
    '.brk{font-size:clamp(20px,3vw,40px);font-weight:800;color:#003366;opacity:.5}',
    '.bnm{font-size:clamp(20px,3.2vw,44px);font-weight:700;color:#003366;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
    '.bpt{font-size:clamp(24px,4vw,56px);font-weight:800;color:#FF8800}'
  ].join('');

  /* Folienleiste + Editor-Chrome aus/an. Das Deck hört auf diese Nachricht. */
  function presenting(on){
    try{ window.postMessage({__omelette_presenting:!!on},'*'); }catch(e){}
  }

  function renderBeamer(){
    if(!root) return;
    root.innerHTML='';
    var st=document.createElement('style'); st.textContent=CSS_B; root.appendChild(st);
    if(S.board){
      var b=document.createElement('div'); b.className='board';
      var h=document.createElement('h2'); h.textContent='Punktestand'; b.appendChild(h);
      ranked().forEach(function(g){
        var r=document.createElement('div');
        r.className='brow'+(g.rank===1?' p1':g.rank===2?' p2':g.rank===3?' p3':'');
        var a=document.createElement('div'); a.className='brk'; a.textContent=g.rank;
        var c=document.createElement('div'); c.className='bnm'; c.textContent=g.name;
        var d=document.createElement('div'); d.className='bpt'; d.textContent=g.p;
        r.appendChild(a); r.appendChild(c); r.appendChild(d); b.appendChild(r);
      });
      root.appendChild(b);
      return;
    }
    if(pWin && !pWin.closed) return;           // Moderatorfenster offen: Beamer bleibt sauber
    var bar=document.createElement('div'); bar.className='fab';
    var f1=document.createElement('button'); f1.className='hot';
    f1.textContent='Moderatoransicht öffnen'; f1.onclick=openPresenter;
    var f2=document.createElement('button'); f2.className='g';
    f2.textContent=S.present?'Folienleiste ein':'Folienleiste aus';
    f2.onclick=function(){ S.present=!S.present; save(); presenting(S.present); renderBeamer(); };
    bar.appendChild(f1); bar.appendChild(f2);
    root.appendChild(bar);
  }
  function mount(){
    if(host&&host.isConnected) return;
    if(!document.body) return;
    host=document.createElement('div');
    host.id='clever-punkte-host';
    host.style.cssText='all:initial;position:static';
    root=host.attachShadow({mode:'open'});
    document.body.appendChild(host);
    renderBeamer();
  }

  /* ── Moderatorfenster ──────────────────────────────────────────────── */
  var pWin=null,pRoot=null,lastIdx=-1;
  var CSS_P=[
    '*{margin:0;padding:0;box-sizing:border-box;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif}',
    'body{background:#0E1B2A;color:#E9EEF4;padding:14px}',
    'button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 14px;background:#1F6FB2;color:#fff;font-weight:700}',
    'button:hover{filter:brightness(1.15)}',
    'button:focus-visible{outline:3px solid #FEBF00;outline-offset:2px}',
    'button.g{background:#26364A}',
    'button.r{background:#8A1B15}',
    'button:disabled{opacity:.4;cursor:default}',
    '.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}',
    '.pos{font-size:20px;font-weight:800;color:#FEBF00}',
    '.sp{flex:1}',
    '.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}',
    '.card{background:#16273B;border-radius:12px;padding:14px}',
    '.card h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#8FA6BD;margin-bottom:8px}',
    '.lbl{font-size:15px;color:#FEBF00;font-weight:700;margin-bottom:6px}',
    '.qq{font-size:21px;font-weight:700;line-height:1.35;margin-bottom:10px}',
    '.ans{padding:6px 9px;border-radius:8px;margin-bottom:4px;font-size:15px;background:#1E3350;line-height:1.35}',
    '.notes{font-size:15px;line-height:1.5;color:#CBD8E6;white-space:pre-wrap}',
    '.next{margin-top:10px;font-size:13px;color:#8FA6BD}',
    '.grow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09)}',
    '.gnm{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
    '.pk{display:flex;gap:5px}',
    '.pk button{width:42px;height:36px;padding:0;background:#26364A;font-weight:800}',
    '.pk button.on[data-k="A"]{background:#E5322B}',
    '.pk button.on[data-k="B"]{background:#F2C300;color:#3A2E00}',
    '.pk button.on[data-k="C"]{background:#12A63A}',
    '.tag{width:34px;text-align:right;font-weight:800;font-size:13px;color:#5FD37E}',
    '.tag.no{color:#FF8B84;opacity:.6}',
    '.right{font-size:14px;color:#5FD37E;font-weight:700;margin-bottom:8px}',
    'input.t{font:inherit;background:#0E1B2A;color:#E9EEF4;border:2px solid #2C3F55;border-radius:8px;padding:6px}',
    'input.num{width:96px}',
    '.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}',
    '.chip{display:flex;align-items:center;background:#0E1B2A;border:2px solid #2C3F55;border-radius:9px;padding:3px 5px}',
    '.chip input{font:inherit;background:transparent;border:none;color:#E9EEF4;width:104px;font-weight:700}',
    '.chip input:focus{outline:none;border-bottom:2px solid #FEBF00}',
    '.chip .x{background:transparent;color:#FF8B84;padding:2px 5px}',
    '.stand{display:grid;grid-template-columns:1.4em 1fr auto;gap:8px;font-size:15px;padding:4px 0}',
    '.stand b{color:#FEBF00}',
    '.hint{font-size:12px;color:#8FA6BD;line-height:1.5;margin-top:8px}',
    '.warn{background:#8A1B15;border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px}'
  ].join('');

  function openPresenter(){
    try{ CLEVER_JINGLE.currentTime = 0; CLEVER_JINGLE.play().catch(function(){}); }catch(e){}
    pWin=window.open('','cleverPresenter','width=1180,height=820');
    if(!pWin){ alert('Das Moderatorfenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben.'); return; }
    pWin.document.open();
    pWin.document.write('<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Moderatoransicht</title></head><body></body></html>');
    pWin.document.close();
    var st=pWin.document.createElement('style'); st.textContent=CSS_P;
    pWin.document.head.appendChild(st);
    pRoot=pWin.document.body;
    pWin.addEventListener('keydown',function(e){
      if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
      var d=deck(); if(!d) return;
      if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ d.next(); e.preventDefault(); }
      if(e.key==='ArrowLeft'||e.key==='PageUp'){ d.prev(); e.preventDefault(); }
    });
    pWin.addEventListener('beforeunload',function(){ pWin=null; S.present=false; save(); presenting(false); renderBeamer(); });
    lastIdx=-1;
    S.present=true; save(); presenting(true);
    renderPresenter();
    renderBeamer();
  }

  function renderPresenter(){
    if(!pWin||pWin.closed||!pRoot) return;
    var D=pWin.document, d=deck();
    pRoot.innerHTML='';
    function E(t,c,x){var e=D.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}

    var idx=d?d.index:0, total=d?d.length:0;
    var qn=qOfSlide(idx), q=qn?Q(qn):null;
    if(q) S.cur=q.n;

    var top=E('div','top');
    top.appendChild(E('span','pos','Folie '+(idx+1)+' / '+total));
    var bp=E('button','g','◀ Zurück'); bp.disabled=!d||idx<=0; bp.onclick=function(){d.prev();};
    var bn=E('button',null,'Weiter ▶'); bn.disabled=!d||idx>=total-1; bn.onclick=function(){d.next();};
    top.appendChild(bp); top.appendChild(bn);
    top.appendChild(E('span','sp'));
    var bb=E('button',S.board?'r':'g',S.board?'Punktestand ausblenden':'Punktestand auf Beamer');
    bb.onclick=function(){ S.board=!S.board; save(); renderBeamer(); renderPresenter(); };
    top.appendChild(bb);
    var bc=E('button','g','CSV'); bc.onclick=function(){exportCsv(D);}; top.appendChild(bc);
    pRoot.appendChild(top);

    if(!canStore) pRoot.appendChild(E('div','warn','Kein Speicher verfügbar — Stand geht beim Neuladen verloren. Vorher CSV sichern.'));

    var cols=E('div','cols');

    /* links: Folie + Notiz */
    var L=E('div','card');
    var info=slideInfo(idx)||{label:'—',notes:'',question:'',answers:[]};
    L.appendChild(E('h3',null,'Aktuelle Folie'));
    L.appendChild(E('div','lbl',info.label));
    if(info.question) L.appendChild(E('div','qq',info.question));
    info.answers.forEach(function(a){ L.appendChild(E('div','ans',a)); });
    if(info.notes){
      L.appendChild(E('h3',null,'Notiz')); L.appendChild(E('div','notes',info.notes));
    }
    var nx=slideInfo(idx+1);
    L.appendChild(E('div','next', nx?('Als Nächstes: '+nx.label):'Letzte Folie'));
    cols.appendChild(L);

    /* rechts: Punkte */
    var R=E('div','card');
    R.appendChild(E('h3',null,'Punkte'));
    if(!q){
      R.appendChild(E('div','notes','Diese Folie gehört zu keiner Frage.'));
    } else {
      R.appendChild(E('div','lbl','Frage '+q.n+' · '+q.titel));
      R.appendChild(E('div','right', q.schaetz?'Richtig: die nächste Schätzung':'Richtig: '+q.right));

      var pl=E('div'); pl.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:10px';
      pl.appendChild(E('span','hint','Punkte:'));
      var pin=D.createElement('input'); pin.type='number'; pin.min='0'; pin.className='t num';
      pin.style.width='70px'; pin.value=S.pts[q.n];
      pin.setAttribute('aria-label','Punkte für Frage '+q.n);
      pin.oninput=function(){ S.pts[q.n]=pin.value===''?0:Number(pin.value); save(); renderStand(); renderBeamer(); };
      pl.appendChild(pin); R.appendChild(pl);

      S.groups.forEach(function(name,gi){
        var r=E('div','grow');
        r.appendChild(E('div','gnm',name||('Gruppe '+(gi+1))));
        if(q.schaetz){
          var inp=D.createElement('input'); inp.className='t num'; inp.inputMode='decimal';
          inp.value=S.est[gi]==null?'':S.est[gi]; inp.placeholder='Gramm';
          inp.setAttribute('aria-label','Schätzung '+name);
          inp.oninput=function(){ S.est[gi]=inp.value; save(); renderPresenter(); renderBeamer(); };
          r.appendChild(inp);
          var t=E('div','tag');
          if(S.measured!==""){ var w=closest().indexOf(gi)>=0; t.textContent=w?'+'+(Number(S.pts[q.n])||0):'0'; if(!w)t.className='tag no'; }
          r.appendChild(t);
        } else {
          var pk=E('div','pk');
          ['A','B','C'].forEach(function(kk){
            var b=E('button',null,kk); b.dataset.k=kk;
            b.setAttribute('aria-label',(name||'Gruppe')+' antwortet '+kk);
            if((S.answers[q.n]||{})[gi]===kk) b.classList.add('on');
            b.onclick=function(){
              S.answers[q.n]=S.answers[q.n]||{};
              if(S.answers[q.n][gi]===kk) delete S.answers[q.n][gi]; else S.answers[q.n][gi]=kk;
              save(); renderPresenter(); renderBeamer();
            };
            pk.appendChild(b);
          });
          r.appendChild(pk);
          var got=(S.answers[q.n]||{})[gi], t2=E('div','tag');
          if(got){ var ok=got===q.right; t2.textContent=ok?'+'+(Number(S.pts[q.n])||0):'0'; if(!ok)t2.className='tag no'; }
          r.appendChild(t2);
        }
        R.appendChild(r);
      });

      if(q.schaetz){
        var mb=E('div'); mb.style.cssText='display:flex;align-items:center;gap:8px;margin-top:10px';
        mb.appendChild(E('span','hint','Gemessen (g):'));
        var mi=D.createElement('input'); mi.className='t num'; mi.inputMode='decimal'; mi.value=S.measured;
        mi.setAttribute('aria-label','Gemessener Wert in Gramm');
        mi.oninput=function(){ S.measured=mi.value; save(); renderPresenter(); renderBeamer(); };
        mb.appendChild(mi); R.appendChild(mb);
        R.appendChild(E('div','hint','Kleinste Abweichung bekommt die Punkte, bei Gleichstand alle Gleichnahen.'));
      }
    }

    /* Gruppen */
    R.appendChild(E('h3',null,'Gruppen'));
    var chips=E('div','chips');
    S.groups.forEach(function(name,i){
      var c=E('div','chip');
      var inp=D.createElement('input'); inp.value=name; inp.setAttribute('aria-label','Name Gruppe '+(i+1));
      inp.oninput=function(){ S.groups[i]=inp.value; save(); renderStand(); renderBeamer(); };
      var x=E('button','x','×'); x.title='Gruppe entfernen';
      x.onclick=function(){
        S.groups.splice(i,1);
        Object.keys(S.answers).forEach(function(qn2){
          var a=S.answers[qn2],out={};
          Object.keys(a).forEach(function(kk){var ki=+kk; if(ki<i)out[ki]=a[kk]; else if(ki>i)out[ki-1]=a[kk];});
          S.answers[qn2]=out;
        });
        var e2={}; Object.keys(S.est).forEach(function(kk){var ki=+kk; if(ki<i)e2[ki]=S.est[kk]; else if(ki>i)e2[ki-1]=S.est[kk];});
        S.est=e2; save(); renderPresenter(); renderBeamer();
      };
      c.appendChild(inp); c.appendChild(x); chips.appendChild(c);
    });
    R.appendChild(chips);
    var add=E('button','g','Gruppe hinzufügen');
    add.onclick=function(){ S.groups.push('Gruppe '+(S.groups.length+1)); save(); renderPresenter(); renderBeamer(); };
    var rst=E('button','r','Zurücksetzen'); rst.style.marginLeft='6px';
    rst.onclick=function(){
      if(!pWin.confirm('Alle Antworten und Punkte löschen? Gruppennamen bleiben.')) return;
      S.answers={};S.est={};S.measured='';
      QUESTIONS.forEach(function(qq){S.pts[qq.n]=qq.pts;});
      save(); renderPresenter(); renderBeamer();
    };
    R.appendChild(add); R.appendChild(rst);

    /* Stand */
    R.appendChild(E('h3',null,'Stand'));
    var standBox=E('div'); standBox.id='stand'; R.appendChild(standBox);
    function renderStand(){
      standBox.innerHTML='';
      ranked().forEach(function(g){
        var row=E('div','stand');
        row.appendChild(E('span',null,g.rank+'.'));
        row.appendChild(E('span',null,g.name));
        var b=D.createElement('b'); b.textContent=g.p; row.appendChild(b);
        standBox.appendChild(row);
      });
    }
    renderStand();
    R.appendChild(E('div','hint','Pfeiltasten in diesem Fenster blättern die Folien auf dem Beamer.'));
    cols.appendChild(R);
    pRoot.appendChild(cols);
  }

  /* Folienwechsel am Beamer spiegeln */
  setInterval(function(){
    var d=deck();
    if(pWin&&pWin.closed){ pWin=null; S.present=false; save(); presenting(false); renderBeamer(); }
    if(!d||!pWin) return;
    if(d.index!==lastIdx){ lastIdx=d.index; renderPresenter(); }
  },200);

  setInterval(mount,250);
  if(document.readyState!=='loading') mount();
  else document.addEventListener('DOMContentLoaded',mount);
})();
</script>

</body>
</html>
