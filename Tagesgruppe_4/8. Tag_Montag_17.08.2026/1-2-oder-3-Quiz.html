<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>1, 2 oder 3 – BULA26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0B1220;
    --bg2: #131B2E;
    --panel1: #E63946; /* Feld 1 - rot */
    --panel2: #2A9D8F; /* Feld 2 - grün/teal */
    --panel3: #F4A300; /* Feld 3 - gelb/orange */
    --gold: #FFD60A;
    --white: #FFFFFF;
    --muted: #9FB0C9;
    --muted-dim: #55647F;
    --correct: #2ECC71;
    --wrong-dim: 0.28;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* ============== AUDIENCE VIEW ============== */
  #audience {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 15% 10%, rgba(230,57,70,0.18) 0%, rgba(230,57,70,0) 45%),
      radial-gradient(circle at 85% 15%, rgba(42,157,143,0.18) 0%, rgba(42,157,143,0) 45%),
      radial-gradient(circle at 50% 100%, rgba(244,163,0,0.14) 0%, rgba(244,163,0,0) 50%),
      var(--bg);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 40px 6px 40px;
  }
  .brand {
    font-size: 22px; font-weight: 800; letter-spacing: 1px; color: var(--gold);
    font-style: italic;
  }
  .brand span { color: var(--white); }
  .progress {
    font-size: 16px; color: var(--muted); font-weight: 600;
  }
  .catchip {
    display: inline-block; margin: 0 auto; padding: 6px 22px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px; font-size: 14px; letter-spacing: 2px; font-weight: 700;
    color: var(--gold); text-transform: uppercase;
  }
  .catwrap { text-align: center; margin-top: 6px; }

  #questionText {
    text-align: center;
    font-size: 44px;
    font-weight: 800;
    line-height: 1.25;
    margin: 22px auto 0 auto;
    padding: 0 70px;
    max-width: 1500px;
    text-shadow: 0 3px 18px rgba(0,0,0,0.45);
  }

  .timerWrap {
    width: 480px; max-width: 70%;
    margin: 20px auto 4px auto;
    height: 14px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .timerBar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--gold), #FF7A18);
    transform-origin: left;
    transition: width 1s linear;
  }
  .timerLabel {
    text-align: center; font-size: 15px; color: var(--muted); margin-bottom: 6px; min-height: 20px;
  }

  .panels {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 26px;
    padding: 18px 50px 44px 50px;
  }
  .panel {
    position: relative;
    border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 38px 26px 30px 26px;
    text-align: center;
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.3), opacity 0.4s, box-shadow 0.35s;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .panel .num {
    font-size: 72px; font-weight: 900; margin-bottom: 8px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .panel .numDivider {
    width: 56px; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.45);
    margin-bottom: 34px;
  }
  .panel .txt {
    font-size: 38px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    flex: 1;
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 6px;
  }
  .panel1 { background: linear-gradient(160deg, var(--panel1), #a52630); }
  .panel2 { background: linear-gradient(160deg, var(--panel2), #1c6b61); }
  .panel3 { background: linear-gradient(160deg, var(--panel3), #b87700); }

  .panel .badge {
    position: absolute; top: 16px; right: 18px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; opacity: 0; transform: scale(0.4);
    transition: opacity 0.3s, transform 0.3s;
  }

  #audience.revealed .panel.is-wrong {
    opacity: var(--wrong-dim);
    transform: scale(0.94);
    filter: grayscale(55%);
  }
  #audience.revealed .panel.is-correct {
    transform: scale(1.06);
    box-shadow: 0 0 0 6px rgba(46,204,113,0.9), 0 20px 50px rgba(46,204,113,0.45);
  }
  #audience.revealed .panel.is-correct .badge {
    opacity: 1; transform: scale(1);
    background: var(--correct);
  }
  #audience.revealed .panel.is-wrong .badge {
    opacity: 1; transform: scale(1);
    background: rgba(0,0,0,0.35);
  }

  .factBox {
    position: absolute; left: 50%; bottom: -110px; transform: translateX(-50%);
    width: 78%; max-width: 1100px;
    background: rgba(6,10,20,0.88);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 18px 30px;
    text-align: center;
    font-size: 19px;
    color: var(--white);
    opacity: 0;
    transition: bottom 0.5s cubic-bezier(.2,.8,.3,1.2), opacity 0.5s;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  #audience.revealed .factBox { bottom: 22px; opacity: 1; }
  .factBox b { color: var(--gold); }

  .confetti-piece {
    position: absolute; top: -20px; width: 9px; height: 14px; opacity: 0.95;
    animation: confetti-fall linear forwards;
    border-radius: 2px;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(340px) rotate(540deg); opacity: 0; }
  }

  .idleScreen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .idleScreen h1 { font-size: 86px; font-style: italic; font-weight: 900; margin: 0; }
  .idleScreen h1 .n1 { color: var(--panel1); }
  .idleScreen h1 .n2 { color: var(--panel2); }
  .idleScreen h1 .n3 { color: var(--panel3); }
  .idleScreen p { color: var(--muted); font-size: 20px; margin-top: 14px; }
  .idleScreen .hint { margin-top: 40px; font-size: 15px; color: var(--muted-dim); }
  .soundUnlockBtn {
    margin-top: 26px; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,214,10,0.4);
    background: rgba(255,214,10,0.1); color: var(--gold); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .soundUnlockBtn:hover { background: rgba(255,214,10,0.2); }
  .soundUnlockBtn:active { transform: scale(0.97); }
  .soundUnlockBtn.done { border-color: rgba(46,204,113,0.5); background: rgba(46,204,113,0.12); color: var(--correct); cursor: default; }
  .musicNote {
    display: inline-block; margin-left: 8px; opacity: 0; transition: opacity 0.25s;
    animation: musicPulse 1s ease-in-out infinite;
  }
  .musicNote.playing { opacity: 1; }
  @keyframes musicPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  .presenterLink {
    position: fixed; right: 18px; bottom: 14px;
    font-size: 12px; color: var(--muted-dim); text-decoration: none;
    padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); cursor: pointer;
  }
  .presenterLink:hover { color: var(--white); border-color: rgba(255,255,255,0.3); }

  /* ============== PRESENTER VIEW ============== */
  #presenter { display: none; flex: 1; flex-direction: column; background: #0A0E18; }
  body.is-presenter #audience { display: none; }
  body.is-presenter #presenter { display: flex; }

  .pTop {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 26px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .pTop .brand { font-size: 18px; }
  .pClock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
  .pBody { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr; gap: 0; overflow: hidden; }
  .pMain { padding: 26px 34px; overflow-y: auto; }
  .pSide { padding: 26px; border-left: 1px solid rgba(255,255,255,0.08); overflow-y: auto; }

  .pCat { color: var(--gold); font-weight: 700; letter-spacing: 1.5px; font-size: 13px; text-transform: uppercase; }
  .pQuestion { font-size: 26px; font-weight: 800; margin: 10px 0 22px 0; line-height: 1.3; }

  .pOpt {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; margin-bottom: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    font-size: 16px;
  }
  .pOpt .n { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
  .pOpt.correct { border-color: var(--correct); background: rgba(46,204,113,0.14); }
  .pOpt.correct .n { background: var(--correct); color: #05210f; }
  .pOpt:not(.correct) .n { background: rgba(255,255,255,0.12); }
  .pOpt .check { margin-left: auto; color: var(--correct); font-weight: 800; opacity: 0; }
  .pOpt.correct .check { opacity: 1; }

  .pFact { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: rgba(255,214,10,0.08); border: 1px solid rgba(255,214,10,0.25); font-size: 14.5px; color: #EDEBDD; }

  .pControls { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: none; cursor: pointer;
    padding: 13px 20px; border-radius: 10px; font-size: 15px; font-weight: 700;
    color: var(--white); background: #1E2740; transition: transform 0.1s, background 0.15s;
  }
  .btn:hover { background: #283355; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--gold); color: #221900; }
  .btn.primary:hover { background: #ffe14d; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.18); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .pSection h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 0; }
  .pTimerRow { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .pTimerRow .val { font-size: 22px; font-weight: 800; width: 60px; text-align: center; }

  .pProgress { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .pProgressBar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .pProgressBar > div { height: 100%; background: linear-gradient(90deg, var(--gold), #FF7A18); }

  .pKeys { font-size: 12.5px; color: var(--muted-dim); line-height: 1.9; margin-top: 22px; }
  .pKeys kbd { background: rgba(255,255,255,0.1); border-radius: 5px; padding: 1px 7px; font-family: inherit; }

  .noOpener { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding: 40px; }
  .noOpener h2 { color: var(--gold); }
</style>
<!-- Fragen liegen in fragen.js (eigene Datei, muss im selben Ordner liegen) -->
<script src="fragen.js"></script>
</head>
<body>

<!-- ============== AUDIENCE / BEAMER VIEW ============== -->
<div id="audience">
  <div class="topbar">
    <div class="brand">1, 2 <span>oder</span> 3<span style="color:var(--white)">!</span></div>
    <div class="progress" id="progressLabel">Frage – / –</div>
  </div>

  <div id="idle" class="idleScreen">
    <h1><span class="n1">1</span>, <span class="n2">2</span> <span style="color:var(--white)">oder</span> <span class="n3">3</span></h1>
    <p>Jungscharlager „Jo und die starken 7“ · BULA26</p>
    <p class="hint" id="idleHint">Bereit, wenn ihr es seid — startet über die Presenter-Ansicht.</p>
    <button id="soundUnlockBtn" class="soundUnlockBtn">🔊 Ton für die Show aktivieren</button>
  </div>

  <div id="quizArea" style="display:none; flex:1; display:none; flex-direction:column;">
    <div class="catwrap"><span class="catchip" id="catChip">KATEGORIE</span></div>
    <div id="questionText"></div>
    <div class="timerLabel" id="timerLabel"><span id="timerLabelText"></span><span id="musicNote" class="musicNote">🎵</span></div>
    <div class="timerWrap" id="timerWrap" style="visibility:hidden;">
      <div class="timerBar" id="timerBar"></div>
    </div>
    <audio id="countdownAudio" preload="auto" loop></audio>
    <div class="panels" id="panels">
      <div class="panel panel1" data-i="0"><div class="badge">✓</div><div class="num">1</div><div class="numDivider"></div><div class="txt" id="opt0"></div></div>
      <div class="panel panel2" data-i="1"><div class="badge">✓</div><div class="num">2</div><div class="numDivider"></div><div class="txt" id="opt1"></div></div>
      <div class="panel panel3" data-i="2"><div class="badge">✓</div><div class="num">3</div><div class="numDivider"></div><div class="txt" id="opt2"></div></div>
    </div>
    <div class="factBox" id="factBox"></div>
  </div>

  <a class="presenterLink" id="openPresenterLink">Presenter-Ansicht öffnen (P)</a>
</div>

<!-- ============== PRESENTER VIEW ============== -->
<div id="presenter"></div>

  var isPresenterUrl = /presenter=1/.test(location.search);

  var State = {

  function currentQuestion() {

  function goTo(i) {
    stopTimer();

    if (i >= QUESTIONS.length) i = QUESTIONS.length - 1;
    State.idx = i;
    State.phase = "question";
    State.timeLeft = State.timerDuration;
    notify();
  }
  function next() {
    if (State.idx >= QUESTIONS.length - 1) return;
    goTo(State.idx + 1);
  }
  function prev() {
    if (State.idx <= 0) return;
    goTo(State.idx - 1);
  }
  function reveal() {
    if (!currentQuestion()) return;
    stopTimer();
    State.phase = "revealed";
    notify();
  }
  function restart() {
    stopTimer();
    State.idx = -1;
    State.phase = "idle";
    notify();

  function startTimer() {
    if (!currentQuestion() || State.phase === "revealed") return;
    stopTimer();

    State.timerRunning = true;
    notify();
    State.timerHandle = setInterval(function () {
      State.timeLeft -= 1;
      if (State.timeLeft <= 0) {
        State.timeLeft = 0;
        stopTimer();
      }
      notify();

  }
  function stopTimer() {
    if (State.timerHandle) { clearInterval(State.timerHandle); State.timerHandle = null; }

  function setTimerDuration(sec) {

    goTo: goTo, next: next, prev: prev, reveal: reveal, restart: restart,

  };

  // Local remote-control stub used only by the presenter window: same

  var RemoteQuiz = {

    currentQuestion: currentQuestion,
    goTo: function (i) { sendCmd("goTo", i); },
    next: function () { sendCmd("next"); },
    prev: function () { sendCmd("prev"); },
    reveal: function () { sendCmd("reveal"); },
    restart: function () { sendCmd("restart"); },

    toggleMute: function () { sendCmd("toggleMute"); },

  function sendCmd(action, arg) {
    if (window.opener) window.opener.postMessage({ source: "quiz123", type: "cmd", action: action, arg: arg }, "*");
  }

  // Audience/master window: broadcast state to any presenter popups and

  var presenterPopups = [];
  if (!isPresenterRole) {

        timeLeft: State.timeLeft, timerRunning: State.timerRunning, muted: State.muted
      } };
      presenterPopups = presenterPopups.filter(function (w) { return !w.closed; });
      presenterPopups.forEach(function (w) { w.postMessage(payload, "*"); });
    });
    window.addEventListener("message", function (ev) {
      var d = ev.data;

  function renderAudience() {
    var idleEl = document.getElementById("idle");
    var quizArea = document.getElementById("quizArea");
    var audienceEl = document.getElementById("audience");
    var s = Q.state;
    var qz = Q.currentQuestion();

    document.getElementById("progressLabel").textContent =
      qz ? ("Frage " + (s.idx + 1) + " / " + Q.QUESTIONS.length) : ("0 / " + Q.QUESTIONS.length);

    if (!qz) {
      idleEl.style.display = "flex";
      quizArea.style.display = "none";
      audienceEl.classList.remove("revealed");
      return;
    }
    idleEl.style.display = "none";
    quizArea.style.display = "flex";

    document.getElementById("catChip").textContent = qz.cat.toUpperCase();
    document.getElementById("questionText").textContent = qz.q;
    document.getElementById("opt0").textContent = qz.opts[0];
    document.getElementById("opt1").textContent = qz.opts[1];
    document.getElementById("opt2").textContent = qz.opts[2];

    var panels = document.querySelectorAll("#panels .panel");
    panels.forEach(function (p) {
      p.classList.remove("is-correct", "is-wrong");
    });

    var timerWrap = document.getElementById("timerWrap");
    var timerBar = document.getElementById("timerBar");
    var timerLabelText = document.getElementById("timerLabelText");

    if (s.phase === "revealed") {
      audienceEl.classList.add("revealed");
      panels.forEach(function (p) {
        var i = parseInt(p.getAttribute("data-i"), 10);
        p.classList.add(i === qz.correct ? "is-correct" : "is-wrong");
      });
      document.getElementById("factBox").innerHTML = "<b>Aufgelöst:</b> " + qz.fact;
      timerWrap.style.visibility = "hidden";
      timerLabelText.textContent = "";
      spawnConfetti(qz.correct);
    } else {
      audienceEl.classList.remove("revealed");
      document.getElementById("factBox").innerHTML = "";
      if (s.timerRunning || s.timeLeft !== s.timerDuration) {
        timerWrap.style.visibility = "visible";
        var pct = Math.max(0, (s.timeLeft / s.timerDuration) * 100);
        timerBar.style.width = pct + "%";
        timerLabelText.textContent = s.timeLeft > 0 ? ("Noch " + s.timeLeft + " Sekunden ...") : "Zeit ist um!";
      } else {
        timerWrap.style.visibility = "hidden";
        timerLabelText.textContent = "";
      }
    }

    updateCountdownMusic(s);
  }

  // ---------------------------------------------------------------------
  // Countdown music — only ever touched in the audience/master window,

  // ---------------------------------------------------------------------
  var musicPlaying = false;
  function updateCountdownMusic(s) {
    var audioEl = document.getElementById("countdownAudio");
    var noteEl = document.getElementById("musicNote");
    if (!audioEl) return;
    audioEl.muted = !!s.muted;

    var shouldPlay = s.timerRunning && s.phase !== "revealed";
    if (shouldPlay && !musicPlaying) {
      musicPlaying = true;
      try { audioEl.currentTime = 0; } catch (e) {}
      var p = audioEl.play();
      if (p && p.catch) p.catch(function () { /* blocked until sound is unlocked, see soundUnlockBtn */ });
      if (noteEl) noteEl.classList.add("playing");
    } else if (!shouldPlay && musicPlaying) {
      musicPlaying = false;
      audioEl.pause();
      try { audioEl.currentTime = 0; } catch (e) {}
      if (noteEl) noteEl.classList.remove("playing");
    }
  }

      if (s.phase !== "revealed") {
        html += '<div class="pFact">💡 Richtige Antwort (nur hier sichtbar): <b>' + (qz.correct + 1) + ' – ' + qz.opts[qz.correct] + '</b></div>';

    if (!window.opener) {
      document.getElementById("presenter").innerHTML =
        '<div class="noOpener"><h2>Presenter-Ansicht</h2><p>Diese Ansicht muss über den Button „Presenter-Ansicht öffnen“ auf der Hauptseite gestartet werden, damit sie mit der Beamer-Anzeige verbunden ist.</p></div>';
    } else {
      Q.subscribe(renderPresenter);
      window.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { Q.state.phase === "revealed" ? Q.next() : Q.reveal(); }
        else if (e.key === "ArrowLeft") Q.prev();
        else if (e.code === "Space") { e.preventDefault(); Q.reveal(); }
        else if (e.key.toLowerCase() === "t") Q.startTimer();
      });
    }
  } else {
    var audioEl = document.getElementById("countdownAudio");
    if (audioEl) audioEl.src = COUNTDOWN_AUDIO_SRC;

    document.getElementById("soundUnlockBtn").addEventListener("click", function (btn) {
      var el = document.getElementById("countdownAudio");
      var play = el.play();
      if (play && play.then) {
        play.then(function () { el.pause(); el.currentTime = 0; markSoundUnlocked(); })
            .catch(function () { markSoundUnlocked(true); });
      } else {
        el.pause(); markSoundUnlocked();
      }
    });
    function markSoundUnlocked(failed) {
      var btn = document.getElementById("soundUnlockBtn");
      if (failed) { btn.textContent = "⚠️ Ton blockiert – Browser-Einstellungen prüfen"; return; }
      btn.textContent = "✅ Ton aktiviert";
      btn.classList.add("done");
    }

    Q.subscribe(renderAudience);
    document.getElementById("openPresenterLink").addEventListener("click", function () {
      var win = window.open(location.pathname + "?presenter=1", "presenter",
        "width=1180,height=760,menubar=no,toolbar=no,location=no,status=no");
      if (win) presenterPopups.push(win);
    });
    window.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { Q.state.phase === "revealed" ? Q.next() : Q.reveal(); }
      else if (e.key === "ArrowLeft") Q.prev();
      else if (e.code === "Space") { e.preventDefault(); Q.reveal(); }
      else if (e.key.toLowerCase() === "t") Q.startTimer();
      else if (e.key.toLowerCase() === "p") document.getElementById("openPresenterLink").click();
      else if (e.key.toLowerCase() === "m") Q.toggleMute();
    });
  }
})();
</script>
</body>
</html>
